<!DOCTYPE html>

<html lang="zh-CN" data-theme="light"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>希凡工作台</title>
<style>
/* ============ 主题变量 ============ */
:root, html[data-theme="light"]{
  --bg:#f4f6fa; --card:#ffffff; --text:#1f2d3d; --muted:#6b7785;
  --primary:#2e9e5b; --primary-d:#22834a; --primary-text:#ffffff;
  --border:#e6e9ef; --input:#ffffff; --input-b:#d8dee8;
  --danger:#e5484d; --warn:#f5a623; --success:#2e9e5b; --info:#3a8ee6;
  --chip:#eef2f7; --shadow:0 2px 10px rgba(20,40,70,.06);
  --hover:#f0f4f9; --grid-line:#eef1f6;
}
html[data-theme="dark"]{
  --bg:#14171d; --card:#1d212a; --text:#e6e9ef; --muted:#9aa4b2;
  --primary:#43c08a; --primary-d:#2fa873; --primary-text:#06281a;
  --border:#2a2f3a; --input:#232833; --input-b:#333a47;
  --danger:#ff6b70; --warn:#ffba49; --success:#43c08a; --info:#5aa9ff;
  --chip:#262c38; --shadow:0 2px 12px rgba(0,0,0,.35);
  --hover:#252b36; --grid-line:#262c38;
}
html[data-theme="blue"]{
  --bg:#e8f3fb; --card:#f3faff; --text:#143b5c; --muted:#5b87a8;
  --primary:#1e90c8; --primary-d:#1577a8; --primary-text:#ffffff;
  --border:#cfe6f5; --input:#ffffff; --input-b:#bcdcf0;
  --danger:#e5484d; --warn:#f5a623; --success:#1e90c8; --info:#1e90c8;
  --chip:#dcefff; --shadow:0 2px 10px rgba(30,120,180,.08);
  --hover:#e3f3fc; --grid-line:#dcefff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  transition:background .25s,color .25s;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);
  background:var(--input);border:1px solid var(--input-b);border-radius:8px;padding:8px 10px;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
textarea{resize:vertical}

/* ============ 布局 ============ */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);
  border-bottom:1px solid var(--border);box-shadow:var(--shadow);z-index:20;flex-shrink:0}
.brand{font-size:19px;font-weight:800;letter-spacing:1px;color:var(--primary)}
.brand .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--primary);margin-right:8px;vertical-align:middle}
.term{font-size:12px;color:var(--muted);background:var(--chip);padding:3px 10px;border-radius:20px;white-space:nowrap}
.quote{flex:1;font-size:13px;color:var(--muted);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.toolbar{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 11px;
  border:1px solid var(--border);background:var(--card);border-radius:9px;color:var(--text);font-size:13px;transition:.2s}
.icon-btn:hover{background:var(--hover);border-color:var(--primary)}
.icon-btn.primary{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.icon-btn.primary:hover{background:var(--primary-d)}
.sync-btn{position:relative}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:.2s}
.sync-dot.ok{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.sync-dot.warn{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.sync-dot.err{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.25)}
.sync-dot.busy{background:#3b82f6;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sync-status{font-size:12px;margin:6px 0 12px;padding:8px 10px;border-radius:8px;background:var(--chip);color:var(--muted)}
.sync-status.ok{color:#16a34a}.sync-status.err{color:#dc2626}.sync-status.warn{color:#d97706}
.sync-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sync-row .btn{flex:1;min-width:120px}

.body{display:flex;flex:1;overflow:hidden;position:relative}
.sidebar{position:fixed;top:56px;left:0;bottom:0;width:112px;background:var(--card);border-right:1px solid var(--border);
  box-shadow:2px 0 14px -6px rgba(0,0,0,.25);z-index:60;
  display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:6px;overflow-y:auto;
  transition:box-shadow .2s}
.sidebar.dragging{box-shadow:0 14px 40px -8px rgba(0,0,0,.45);opacity:.97;user-select:none}
.side-grip{width:84px;display:flex;align-items:center;justify-content:center;gap:3px;cursor:grab;
  padding:5px 0 7px;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:4px;touch-action:none}
.side-grip:active{cursor:grabbing}
.side-grip i{width:4px;height:4px;border-radius:50%;background:var(--muted);display:inline-block}
.nav-item[draggable="true"]{cursor:grab}
.nav-item[draggable="true"]:active{cursor:grabbing}
.nav-item.drag-src{opacity:.35}
.nav-item.drag-over{outline:2px dashed var(--primary);outline-offset:-3px;background:var(--chip)}
.nav-item{width:96px;padding:9px 4px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:5px;
  color:var(--muted);transition:.18s;cursor:pointer;border:1px solid transparent}
.nav-item .ch{font-size:23px;line-height:1;filter:grayscale(.15);transition:.18s}
.nav-item .name{font-size:12px;line-height:1.25;text-align:center;white-space:nowrap;font-weight:500}
.nav-item:hover{background:var(--hover);color:var(--text);transform:translateY(-1px)}
.nav-item:hover .ch{filter:grayscale(0)}
.nav-item.active{background:var(--primary);color:var(--primary-text);border-color:var(--primary);box-shadow:0 6px 16px -6px var(--primary)}
.nav-item.active .ch{filter:none;transform:scale(1.06)}
.nav-item.active .name{color:var(--primary-text);font-weight:600}

.content{flex:1;overflow-y:auto;padding:20px 26px 60px;margin-left:112px}
.view{display:none;animation:fade .25s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-title{font-size:20px;font-weight:800;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.section{margin-bottom:26px}
.section-h{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-h::before{content:"";width:4px;height:16px;background:var(--primary);border-radius:3px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .stat .num{font-size:28px;font-weight:800;color:var(--primary)}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}
  /* 可点击的分层卡片 */
  .stat.layer-card{cursor:pointer;transition:all .15s;position:relative}
  .stat.layer-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 6px 14px rgba(46,158,91,.18)}
  .stat.layer-card.active{border-color:var(--primary);background:linear-gradient(135deg,#f0faf3,#e8f7ee);box-shadow:0 4px 10px rgba(46,158,91,.22)}
  .stat.layer-card .layer-arrow{float:right;font-size:14px;color:var(--muted);transition:transform .2s;display:inline-block;margin-left:4px}
  .stat.layer-card.active .layer-arrow{transform:rotate(180deg);color:var(--primary)}
  /* 折叠区 */
  .layer-detail{margin:8px 0 18px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;animation:layerExpand .25s ease}
  .layer-detail[hidden]{display:none}
  @keyframes layerExpand{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card-h{font-weight:700;margin-bottom:12px;font-size:15px;display:flex;align-items:center;justify-content:space-between}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:13px;transition:.18s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-d)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.hidden{display:none!important}
.st-batch{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:9px 14px;background:var(--chip);border:1px solid var(--border);border-radius:10px;font-weight:600}
.item.sel{background:var(--chip);border-color:var(--primary)}
.check{cursor:pointer;user-select:none}
.check:hover{opacity:.85}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent;border-style:dashed;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
/* 科目 chip 选择器 */
.subj-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:38px;padding:8px 10px;border:1px dashed var(--border);border-radius:10px;background:var(--hover);margin:6px 0 8px}
.subj-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:var(--chip);color:var(--text);border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--border)}
.subj-chip b{cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0 2px}
.subj-chip b:hover{color:var(--danger)}
.subj-empty{color:var(--muted);font-size:13px}
.subj-add{margin-top:4px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--chip);color:var(--muted)}
.tag.green{background:rgba(46,158,91,.14);color:var(--success)}
.tag.red{background:rgba(229,72,77,.14);color:var(--danger)}
.tag.blue{background:rgba(58,142,230,.14);color:var(--info)}
.tag.warn{background:rgba(245,166,35,.16);color:var(--warn)}
.tag.important{background:rgba(245,166,35,.18);color:var(--warn)}
.tag.urgent{background:rgba(229,72,77,.16);color:var(--danger)}
.weak-chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none;transition:.15s;font-size:12px!important;padding:5px 12px!important}
.weak-chip:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.08);filter:brightness(0.97)}
.weak-chip.active{outline:2px solid currentColor;outline-offset:2px;font-weight:700}
.weak-chip .weak-chev{font-size:10px;opacity:.7;transition:.2s;display:inline-block}
.weak-chip.active .weak-chev{transform:rotate(180deg)}

.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 15px;display:flex;align-items:flex-start;gap:12px;transition:.18s}
.item:hover{box-shadow:var(--shadow)}
.item.done{opacity:.6}
.item.done .it-title{text-decoration:line-through}
.it-main{flex:1;min-width:0}
.it-title{font-weight:600;font-size:14px}
.it-meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.it-actions{display:flex;gap:6px;flex-shrink:0}
.check{flex-shrink:0;width:22px;height:22px;border-radius:6px;border:2px solid var(--input-b);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;font-size:13px;color:#fff}
.check.on{background:var(--primary);border-color:var(--primary)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{padding:8px 14px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border-bottom:2px solid transparent;cursor:pointer}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-content{display:none}
.tab-content.active{display:block}

.chip{display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;background:var(--chip);color:var(--muted);cursor:pointer;border:1px solid transparent;transition:.15s}
.chip.active{background:var(--primary);color:var(--primary-text)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal.wide{max-width:880px}
.imp-prev{margin-top:12px;max-height:42vh;overflow-y:auto;border:1px solid var(--border);border-radius:10px}
.imp-prev table{width:100%;border-collapse:collapse;font-size:13px}
.imp-prev th,.imp-prev td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left}
.imp-prev input{border:none;background:transparent;padding:4px 2px;width:100%}
.imp-prev input:focus{background:var(--chip)}
.imp-prev .del{color:var(--danger);cursor:pointer;font-weight:700}
.imp-note{font-size:12px;color:var(--muted);margin-top:8px}
.imp-loading{padding:20px;text-align:center;color:var(--muted)}
.modal h3{margin-bottom:14px;font-size:17px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

.bar{height:18px;border-radius:9px;background:var(--chip);overflow:hidden;position:relative;min-width:80px}
.bar > i{display:block;height:100%;border-radius:9px;background:var(--success);transition:width .5s}
.bar.warn > i{background:var(--warn)}
.bar.danger > i{background:var(--danger)}
.bar-lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}

.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:13px}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.5}

/* 座位 / 课表 网格 */
.seat-layout{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;min-height:540px}
.seat-pool{width:150px;flex-shrink:0;background:var(--chip);border:1px solid var(--border);border-radius:12px;padding:12px}
.seat-pool-h{font-weight:700;font-size:13px;margin-bottom:8px}
.seat-pool-list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto}
.pool-item{padding:7px 10px;background:var(--card);border:1px solid var(--input-b);border-radius:8px;font-size:13px;cursor:grab;text-align:center;user-select:none}
.pool-item:active{cursor:grabbing}
/* 座位网格：固定高度让每格 1fr 平铺整个区域 */
.seat-grid{
  display:grid;gap:4px;flex:1;min-width:0;position:relative;
  height:clamp(520px,min(72vh,820px),760px);
  background:linear-gradient(135deg,#f6fbff 0%,#eaf3ff 100%);
  border:1px solid var(--border);border-radius:14px;padding:12px;
}
.seat{aspect-ratio:auto;min-height:0;min-width:0;border:1.5px dashed var(--input-b);border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:12px;text-align:center;padding:2px;cursor:pointer;background:var(--card);transition:.15s;user-select:none;overflow:hidden}
.seat.rowlabel{aspect-ratio:auto;min-height:0;min-width:0;border:none;background:transparent;font-weight:700;color:var(--muted);cursor:default;font-size:13px}
.seat.corner{background:transparent;border:none;cursor:default}
.seat.filled{border-style:solid;border-color:var(--primary);background:var(--chip);font-weight:700;color:var(--text);cursor:grab;font-size:18px;line-height:1.12;padding:1px 3px;word-break:break-all}
.seat.filled:active{cursor:grabbing}
.seat[draggable=true]:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
/* 走廊作为网格中的一条真实通道列（Excel 式插入），不占座位 */
.seat.corridor-cell{background:repeating-linear-gradient(45deg,#eef4fb 0 7px,#e3edf8 7px 14px);border:none;cursor:default}
.seat.corridor-h{background:transparent;border:none;color:#aebccd;cursor:pointer;font-size:12px;font-weight:700}
.seat.corridor-h:hover{color:#e74c3c}
/* 讲台作为网格中的一条真实通道行（Excel 式插入），不占座位 */
.seat.podium-cell{background:linear-gradient(180deg,#d9c3a0,#c2a374);border:none;color:#5a3a18;font-weight:700;letter-spacing:6px;border-radius:8px;cursor:pointer}
.seat.podium-cell:hover{filter:brightness(.96);color:#7a4a20}
/* 被讲台覆盖的座位格：自动清掉内容、不可拖入 */
.seat.blocked{
  background:repeating-linear-gradient(45deg,#f1f6fc 0 6px,#e8f0f9 6px 12px);
  border:1.5px dotted #b8c5d5;border-radius:8px;
  color:#94a3b8;font-size:11px;cursor:not-allowed;opacity:.78;
  position:relative;
}
.seat.blocked::after{content:'×';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b8c5d5;font-weight:600;font-size:14px}
/* 走廊 / 讲台覆盖层（绝对定位、可拖动、按班独立保存） */
.seat-overlay{position:absolute;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;border-radius:8px;user-select:none;cursor:move;z-index:5;
  border:1.5px dashed currentColor;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:box-shadow .15s,transform .12s}
.seat-overlay:hover{box-shadow:0 5px 16px rgba(0,0,0,.16);transform:translateY(-1px)}
.seat-overlay.dragging{opacity:.85;cursor:grabbing;transform:scale(1.01);box-shadow:0 10px 24px rgba(0,0,0,.22)}
.seat-overlay.corridor{background:rgba(255,225,140,.78);color:#7a5400;border-color:#a07a00;letter-spacing:6px}
.seat-overlay.podium{background:linear-gradient(180deg,rgba(196,164,124,.92),rgba(168,128,82,.92));color:#fff;border-color:#5a3a18;letter-spacing:8px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
/* 右上角删除按钮：hover 才显示 */
.seat-overlay-x{
  position:absolute;top:3px;right:5px;display:none;align-items:center;justify-content:center;
  font-size:16px;line-height:16px;font-weight:700;color:rgba(0,0,0,.45);cursor:pointer;
  width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.85);
  transition:background .15s,color .15s;
}
.seat-overlay:hover .seat-overlay-x{display:flex;}
.seat-overlay-x:hover{background:#fff;color:#c0392b;box-shadow:0 0 0 2px #c0392b33}

/* 班级切换 tabs */
.stu-cls-tabs{margin-bottom:14px}
.stu-cls-tabs .tab{font-size:14px;padding:7px 18px}
.stu-cls-tabs .tab.active{background:var(--primary);border-color:var(--primary);color:#fff}

.stu-cell{min-height:72px;border:1.5px solid var(--input-b);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;background:var(--card);cursor:pointer;user-select:none;padding:6px 8px;transition:.12s;position:relative;overflow:hidden}
.stu-cell:hover{border-color:var(--primary);filter:brightness(.97)}
.stu-cell .nm{font-size:16px;font-weight:700;color:var(--text);line-height:1.25;word-break:break-all}
.stu-cell .sub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu-cell.empty{border-style:dashed;color:var(--muted);font-size:14px}
/* 学生档案按性别区分背景 */
.stu-cell.st-male{background:#e8f3ff;border-color:#b9d4f0}
.stu-cell.st-female{background:#fff0f6;border-color:#ebc8d6}
.stu-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;max-width:1300px;margin:0 auto}
@media (max-width:1200px){.stu-grid{grid-template-columns:repeat(6,1fr)}}
@media (max-width:900px){.stu-grid{grid-template-columns:repeat(5,1fr)}}
@media (max-width:600px){.stu-grid{grid-template-columns:repeat(4,1fr)}}

/* 考勤点名：单元格（复用 stu-grid 布局，三态边框 + 点击循环切换） */
.at-grid{gap:8px;max-width:1300px}
.at-cell{position:relative;overflow:hidden;aspect-ratio:auto;min-height:96px;padding:8px 6px;border-width:2px;border-radius:12px}
.at-cell .nm{font-size:17px;font-weight:700;color:var(--text);line-height:1.2;word-break:break-all}

function migrate(o){
  if(!o.classes||!o.classes.length)o.classes=[{id:'1',name:'1班'},{id:'2',name:'2班'}];
  if(o.seats && o.seats.layout && !o.seats.layouts){o.seats.layouts={'1':o.seats.layout};delete o.seats.layout;}
  if(o.seats && !o.seats.layouts)o.seats.layouts={'1':{},'2':{}};
  (o.classes||[]).forEach(c=>{if(o.seats&&o.seats.layouts&&!o.seats.layouts[c.id])o.seats.layouts[c.id]={};});
  if(o.seats && o.seats.rows===6 && o.seats.cols===7){o.seats.rows=8;o.seats.cols=8;}
  if(o.schedule && o.schedule.periods && o.schedule.periods.length===6){
    o.schedule.periods=['晨读','第1节','第2节','第3节','第4节','午休','午餐','第5节','第6节','第7节','第8节','延时服务'];
  }
  /* 已升级到 11 节次（含午休/午餐/延时）但缺少晨读的老数据，前置晨读 */
  if(o.schedule && o.schedule.periods && o.schedule.periods.length===11 && o.schedule.periods[0]!=='晨读'){
    o.schedule.periods=['晨读'].concat(o.schedule.periods);
  }
}

/* ============================================================
   云同步（GitHub Gist）
   数据存为 Gist 文件，多设备凭同一 token + gistId 互相同步
   ============================================================ */
const SYNC_KEY='xifan_sync_v1';
const SYNC_FILE='xifan-workbench-data.json';
let SYNC=loadSync();
let _autoPushTimer=null;
function loadSync(){try{const r=localStorage.getItem(SYNC_KEY);if(r)return JSON.parse(r);}catch(e){}return {token:'',gistId:'',enabled:false,auto:true,lastRev:0,lastTs:0};}
function saveSync(){localStorage.setItem(SYNC_KEY,JSON.stringify(SYNC));}
function setSyncDot(state){const d=$('#syncDot');if(!d)return;d.className='sync-dot'+(state?' '+state:'');}
function gistHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+SYNC.token};}
async function gistApi(method,id,body){
  const url=id?`https://api.github.com/gists/${id}`:'https://api.github.com/gists';
  const opt={method,headers:gistHeaders()};
  if(body)opt.body=JSON.stringify(body);
  const res=await fetch(url,opt);
  if(!res.ok){let msg='HTTP '+res.status;try{const j=await res.json();if(j&&j.message)msg=j.message;}catch(e){}throw new Error(msg);}
  return res.json();
}
function wrapDb(){return {rev:(SYNC.lastRev||0)+1,ts:Date.now(),db:DB};}
function applyRemote(payload){
  if(!payload||!payload.db)throw new Error('云端数据格式异常');
  DB=payload.db;
  // 兼容老数据字段
  if(!DB.classes||!DB.classes.length)DB.classes=[{id:'1',name:'1班'},{id:'2',name:'2班'}];
  if(!DB.seats)DB.seats={rows:8,cols:8,layouts:{'1':{},'2':{}}};
  if(DB.seats.layout && !DB.seats.layouts){DB.seats.layouts={'1':DB.seats.layout};delete DB.seats.layout;}
  if(!DB.seats.layouts)DB.seats.layouts={'1':{},'2':{}};
  DB.classes.forEach(c=>{if(!DB.seats.layouts[c.id])DB.seats.layouts[c.id]={};});
  if(!DB.schedule)DB.schedule={periods:['晨读','第1节','第2节','第3节','第4节','午休','午餐','第5节','第6节','第7节','第8节','延时服务'],days:['周一','周二','周三','周四','周五'],grid:{}};
  if(!DB.todos)DB.todos=[];
  if(!DB.students)DB.students=[];
  if(!DB.phrases)DB.phrases=[];
  if(!DB.exams)DB.exams=[];
  if(!DB.knowledge)DB.knowledge=[];
  if(!DB.attendance)DB.attendance=[];
  if(!DB.emergency)DB.emergency=[];
  if(!DB.archive)DB.archive=[];
  SYNC.lastRev=payload.rev||1;SYNC.lastTs=payload.ts||Date.now();saveSync();save();
  if(typeof CUR!=='undefined'&&CUR)showView(CUR);
}
async function gistPush(force){
  if(!SYNC.token||!SYNC.gistId)throw new Error('请先配置令牌与 Gist');
  setSyncDot('busy');
  try{
    if(!force){
      const cur=await gistApi('GET',SYNC.gistId);
      const remote=cur.files&&cur.files[SYNC_FILE]?JSON.parse(cur.files[SYNC_FILE].content||'{}'):{rev:0};
      if(remote.rev&&remote.rev!==SYNC.lastRev){
        setSyncDot('warn');
        throw new Error('CONFLICT'); // 远程有他人更新，需先下载
      }
    }
    const wrapped=wrapDb();
    await gistApi('PATCH',SYNC.gistId,{files:{[SYNC_FILE]:{content:JSON.stringify(wrapped)}}});
    SYNC.lastRev=wrapped.rev;SYNC.lastTs=wrapped.ts;saveSync();setSyncDot('ok');
    return true;
  }catch(e){if(e.message!=='CONFLICT')setSyncDot('err');throw e;}
}
async function gistPull(){
  if(!SYNC.token||!SYNC.gistId)throw new Error('请先配置令牌与 Gist');
  setSyncDot('busy');
  const cur=await gistApi('GET',SYNC.gistId);
  const content=cur.files&&cur.files[SYNC_FILE]?cur.files[SYNC_FILE].content:null;
  if(!content)throw new Error('云端暂无数据');
  const payload=JSON.parse(content);
  applyRemote(payload);setSyncDot('ok');return true;
}
function scheduleAutoPush(){
  if(!SYNC.auto)return;
  clearTimeout(_autoPushTimer);
  _autoPushTimer=setTimeout(()=>{
    gistPush(false).catch(e=>{
      if(e.message==='CONFLICT'){toast('云端有其它设备更新，请打开「☁ 同步」下载合并');setSyncDot('warn');}
      else toast('自动同步失败：'+e.message);
    });
  },1200);
}
async function gistCreate(){
  const wrapped={rev:1,ts:Date.now(),db:DB};
  const g=await gistApi('POST',null,{public:false,description:'希凡工作台数据同步',files:{[SYNC_FILE]:{content:JSON.stringify(wrapped)}}});
  SYNC.gistId=g.id;SYNC.lastRev=1;SYNC.lastTs=wrapped.ts;SYNC.enabled=true;saveSync();
  setSyncDot('ok');return g.id;
}

  const refresh=()=>{$('#syncInfo').textContent=(SYNC.gistId?('已连接 Gist：'+SYNC.gistId.slice(0,8)+'…　最后：'+(SYNC.lastTs?new Date(SYNC.lastTs).toLocaleString():'无')):'尚未连接');};

  };
  $('#syncPull').onclick=async()=>{
    SYNC.token=$('#syncToken').value.trim();SYNC.gistId=$('#syncGist').value.trim();saveSync();

  };
}
/* 后台轮询：每隔 interval（默认 60s）检测云端 rev，发现新版本自动拉取，
   这样手机改完数据，电脑/平板开着页面也能在 1 分钟内自动收到更新 */
let _pollTimer=null,_pollNotified=0;
function startSyncPolling(interval){
  if(_pollTimer)clearInterval(_pollTimer);
  if(!interval||interval<10000)interval=60000;
  _pollTimer=setInterval(async()=>{
    if(!SYNC.enabled||!SYNC.token||!SYNC.gistId)return;
    try{
      const cur=await gistApi('GET',SYNC.gistId);
      const remote=cur.files&&cur.files[SYNC_FILE]?JSON.parse(cur.files[SYNC_FILE].content||'{}'):{rev:0};
      if(remote.rev&&remote.rev>SYNC.lastRev){
        setSyncDot('busy');
        await gistPull();
        if(remote.rev!==_pollNotified){toast('☁ 已从云端同步最新数据');_pollNotified=remote.rev;}
      }
    }catch(e){/* 静默，避免打扰 */}
  },interval);
}

}

/* 内容区随侧边栏位置自动避让（左/右贴边） */
function updateContentMargin(){
  const sb=$('#sidebar');const c=$('#content');if(!sb||!c)return;
  const r=sb.getBoundingClientRect();const cx=r.left+r.width/2;
  if(cx<window.innerWidth/2){c.style.marginLeft=(r.width+8)+'px';c.style.marginRight='0';}
  else{c.style.marginRight=(window.innerWidth-r.left+8)+'px';c.style.marginLeft='0';}
}
/* 响应式：手机端侧边栏转为底部条，清除桌面端内联定位；其余端保持避让 */
const MOBILE_W=600;
function applyResponsive(){
  const sb=$('#sidebar'),c=$('#content');
  if(window.innerWidth<=MOBILE_W){sb.style.left='';sb.style.top='';if(c){c.style.marginLeft='';c.style.marginRight='';}}
  else{updateContentMargin();}
}
/* 横屏提示：平板/电脑竖屏时建议横屏（手机已适配竖屏，不提示） */
function setupRotateTip(){
  const mq=window.matchMedia('(min-width:601px) and (orientation:portrait)');
  const apply=()=>{
    const dismissed=sessionStorage.getItem('xifan_rotate_ok')==='1';
    document.body.classList.toggle('show-rotate', mq.matches && !dismissed);
  };
  mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply);
  apply();
  const btn=document.getElementById('rotateContinue');
  if(btn)btn.addEventListener('click',()=>{sessionStorage.setItem('xifan_rotate_ok','1');document.body.classList.remove('show-rotate');});

  const map={home:renderHome,students:renderStudents,seats:renderSeats,grades:renderGrades,

document.addEventListener('click',e=>{

  const go=e.target.closest('[data-go]');if(go){showView(go.dataset.go);return;}
  const act=e.target.closest('[data-action]');if(!act)return;

function handleAction(a,el,e){
  switch(a){
    case 'cycle-theme':cycleTheme();break;
    case 'export':exportData();break;
    case 'import':$('#importFile').click();break;
    case 'open-stats':openStats();break;
    case 'open-calendar':openCalendar();break;
    case 'close-modal':closeModal();break;
    case 'quick-todo':openQuickTodoModal();break;
    case 'open-ai':openAiModal();break;
    case 'cls-manage':openClassManager();break;
    case 'open-doubao':{
      /* 优先尝试 doubao:// 协议唤起豆包桌面客户端；唤起成功（页面切走 hidden=true）则不再回退；
         唤起失败/未安装桌面端则打开网页版 https://www.doubao.com/chat/ */
      const ua=navigator.userAgent;
      const isMac=/Mac/i.test(ua),isWin=/Windows/i.test(ua);
      const proto=isMac?'doubao://chat':'doubao://chat';
      const start=Date.now();
      try{window.location.href=proto;}catch(_){}
      /* 桌面端唤起需时通常 <1.5s；1.5s 后还在前台 → 协议失败 → 兜底网页版 */
      setTimeout(()=>{
        if(Date.now()-start<1600 && document.visibilityState!=='hidden'){
          window.open('https://www.doubao.com/chat/','_blank');
          toast('未检测到豆包桌面端，已打开网页版');
        }else{
          toast('已唤起豆包');
        }
      },700);
      break;
    }
    case 'open-todo':openTodoModal();break;
    case 'open-sync':openSyncPanel();break;
    case 'todo-toggle':{
      const id=el.dataset.id;
      const t=DB.todos.find(x=>x.id===id);
      if(t){t.done=true;save();renderHomeReminder();toast('已标记完成');}
      break;
    }
  }
}

function renderHomeClock(){

    el.textContent=`${hh}  :  ${mm}  :  ${ss}`;
    // 农历
    const lunar=document.getElementById('homeLunar');
    if(lunar){

      if(l){
        const gzY='甲乙丙丁戊己庚辛壬癸'[(l.ly-4)%10]+'子丑寅卯辰巳午未申酉戌亥'[(l.ly-4)%12];
        lunar.textContent=`${gzY}年 · ${LMN[l.lm]||''}${LDN[l.ld]||'—'} · 星期${['日','一','二','三','四','五','六'][d.getDay()]}`;
      } else {

function renderHomeSched(){
  const box=document.getElementById('homeTodaySched');if(!box)return;
  const wd=['日','一','二','三','四','五','六'];
  const today=new Date().getDay();
  const todayName='周'+wd[today];
  const schedDays=DB.schedule.days||[];
  const periods=DB.schedule.periods||[];
  if(!periods.length||!schedDays.length){
    box.innerHTML='<div class="empty"><div class="big">📅</div>暂无课程表，请到「课程表」录入</div>';return;
  }

  }

  const items=[];

    const key=pi+'-'+di;

/* 待办紧急程度：依据截止时间自动判定，与分类无关
   逾期 或 ≤2天 → 紧急(红)；3~7天 → 临近(蓝)；>7天 或 无期限 → 正常(绿) */
function todoUrgency(t){
  if(!t.deadline)return {cls:'normal',text:'正常'};
  const p=String(t.deadline).split('-');if(p.length!==3)return {cls:'normal',text:'正常'};
  const due=new Date(+p[0],+p[1]-1,+p[2]);if(isNaN(due))return {cls:'normal',text:'正常'};
  const today=new Date();const t0=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const days=Math.round((due-t0)/86400000);
  if(days<0)return {cls:'urgent',text:'逾期'};
  if(days<=2)return {cls:'urgent',text:'紧急'};
  if(days<=7)return {cls:'steady',text:'临近'};
  return {cls:'normal',text:'正常'};
}

      <span class="remind-dot ${u.cls}"></span>

}

function addClass(){
  let max=0;(DB.classes||[]).forEach(c=>{const n=parseInt(c.id,10);if(!isNaN(n)&&n>max)max=n;});
  let newId=String(max+1);
  if((DB.classes||[]).some(c=>c.id===newId))newId='c'+Date.now().toString(36);
  DB.classes=DB.classes||[];
  DB.classes.push({id:newId,name:newId+'班'});
  if(!DB.seats.layouts)DB.seats.layouts={};
  DB.seats.layouts[newId]={};
  save();toast('已新增班级：'+newId+'班');
}
function renameClass(id,name){
  if(!name)return;
  const c=(DB.classes||[]).find(x=>x.id===id);
  if(c){c.name=name;save();}
}
function deleteClass(id){
  if((DB.classes||[]).length<=1){toast('至少保留 1 个班级');return;}
  const others=(DB.classes||[]).filter(c=>c.id!==id);
  if(!others.length)return;
  const stuCnt=DB.students.filter(s=>stuCls(s)===id && !s.archived).length;
  const html=`<div class="cls-del">
    <div class="section-h">删除班级「${esc(clsLabel(id))}」</div>
    <div class="muted" style="font-size:13px;margin:8px 0">该班共 <b>${stuCnt}</b> 名在读学生。删除后，该班的座位、成绩、考勤数据会被清除。请选择把学生并入哪个班：</div>
    <div class="row"><select id="clsDelTarget" style="min-width:160px">${others.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
    <div class="row" style="margin-top:10px">
      <button class="btn sm" data-action="close-modal">取消</button>
      <span style="flex:1"></span>
      <button class="btn sm danger" data-action="cls-del-confirm" data-id="${id}">确认删除并并入</button>
    </div>
  </div>`;
  openModal(html);
  const btn=$('#modalBox').querySelector('[data-action="cls-del-confirm"]');
  if(btn)btn.onclick=()=>{
    const target=$('#clsDelTarget').value;
    doDeleteClass(id,target);
    if(typeof CUR!=='undefined'&&CUR)showView(CUR);
    closeModal();openClassManager();
  };
}
function doDeleteClass(id,target){
  DB.students.forEach(s=>{if(stuCls(s)===id)s.cls=target;});
  if(DB.seats.layouts && DB.seats.layouts[id])delete DB.seats.layouts[id];
  DB.attendance=DB.attendance.filter(a=>a.cls!==id);
  DB.exams=DB.exams.filter(e=>(e.cls||'1')!==id);
  DB.classes=DB.classes.filter(c=>c.id!==id);
  if(curCls===id)curCls=target;
  save();toast('已删除班级，学生已并入'+clsLabel(target));
}

/* 文本 / OCR 结果解析：每行一个，可含逗号或制表符分隔的附加信息 */
function parseStudentText(text){
  const lines=(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  return lines.map(line=>{
    const parts=line.split(/[,，\t]+/).map(s=>s.trim()).filter(Boolean);
    const name=parts[0]||line;
    return {name,no:parts[1]||'',gender:parts[2]||'',phone:parts[3]||'',parent:parts[4]||'',notes:''};
  });
}

async function onExcel(file){
  if(!file){return;}
  const wrap=$('#impPreviewWrap');wrap.innerHTML='<div class="imp-loading">正在解析表格…</div>';
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    stImportRows=xlsxToStudents(rows);
    renderImpPreview();
  }catch(err){wrap.innerHTML='<div class="imp-note" style="color:var(--danger)">解析失败：'+(err.message||err)+'（请确认文件为 .xlsx/.xls/.csv，或联网后重试）</div>';}

/* 下载学生导入模板（表头 + 一行示例 + 多个空行） */
async function downloadStudentTemplate(){
  try{
    if(typeof XLSX==='undefined')await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    const header=['姓名*','学号','性别','电话','家长'];
    const sample=['张三','2024001','男','13800000000','张爸爸'];
    /* 30 行空白占位，方便老师直接填 */
    const blank=Array(30).fill(['','','','','']);
    const ws=XLSX.utils.aoa_to_sheet([header,sample,...blank]);
    /* 给表头和示例行加上颜色方便区分 */
    if(ws['A1'])ws['A1'].s={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'2E9E5B'}}};
    if(ws['A2'])ws['A2'].s={fill:{fgColor:{rgb:'F0F4F9'}},note:'示例行，可删除'};
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'学生');
    XLSX.writeFile(wb,`学生信息导入模板-${new Date().toISOString().slice(0,10)}.xlsx`);
    toast('模板已下载，按格式填好上传即可');
  }catch(err){toast('下载失败：'+(err.message||err));}
}
function xlsxToStudents(rows){
  if(!rows.length)return [];
  let header=null,start=0;
  const f=String(rows[0][0]||'').toLowerCase();
  if(f.includes('姓名')||f.includes('name')||f.includes('学生')){header=rows[0];start=1;}
  const idx=key=>{if(!header)return -1;return header.findIndex(h=>String(h||'').includes(key));};
  const iName=header?Math.max(idx('姓名'),idx('name'),idx('学生'),0):0;
  const iNo=header?idx('学号'):1, iGender=header?idx('性别'):2, iPhone=header?idx('电话'):3, iParent=header?idx('家长'):4;
  const out=[];
  for(let r=start;r<rows.length;r++){
    const row=rows[r];const name=String(row[iName]||'').trim();
    if(!name)continue;
    out.push({name,no:String(row[iNo]||'').trim(),gender:String(row[iGender]||'').trim(),
      phone:String(row[iPhone]||'').trim(),parent:String(row[iParent]||'').trim(),notes:''});
  }
  return out;
}
async function onOcr(file){
  if(!file)return;
  const wrap=$('#impPreviewWrap');wrap.innerHTML='<div class="imp-loading">正在加载识别引擎并识别文字（首次需联网，请稍候）…</div>';
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js');
    const res=await Tesseract.recognize(file,'chi_sim',{logger:()=>{}});

}
async function onDoc(file){

/* 当前班级的座位布局（按班独立存储，避免两班互相覆盖） */
function curSeatLayout(){
  if(!DB.seats.layouts){DB.seats.layouts={};(DB.classes||[]).forEach(c=>DB.seats.layouts[c.id]={});}
  if(!DB.seats.layouts[curCls])DB.seats.layouts[curCls]={};
  const lay=DB.seats.layouts[curCls];
  // 老数据：corridor/podium 覆盖层全部丢弃（走廊→网格列、讲台→网格行）
  if(lay.overlays){
    if(lay.overlays.corridor)delete lay.overlays.corridor;
    if(lay.overlays.podium)delete lay.overlays.podium;
    if(Array.isArray(lay.overlays.list))lay.overlays.list=lay.overlays.list.filter(o=>o.type!=='corridor'&&o.type!=='podium');
  }
  // 走廊（网格列）默认：正中间分开
  if(!DB.seats.corridors || !Array.isArray(DB.seats.corridors)){
    DB.seats.corridors = DB.seats.cols>=2 ? [Math.floor(DB.seats.cols/2)-1] : [];
  }
  DB.seats.corridors = DB.seats.corridors.filter(p=>Number.isInteger(p) && p>=0 && p < DB.seats.cols-1);
  // 讲台（网格行）默认：教室最前方（-1 表示第一行之前）
  if(!DB.seats.podiums || !Array.isArray(DB.seats.podiums)){
    DB.seats.podiums = DB.seats.rows>=1 ? [-1] : [];
  }
  DB.seats.podiums = DB.seats.podiums.filter(p=>Number.isInteger(p) && p>=-1 && p<=DB.seats.rows-1);
  return lay;
}
/* 像 Excel 插入一列：在座位网格中追加一条纵向走廊（全局，不占座位） */
function addCorridor(){
  if(!DB.seats.corridors)DB.seats.corridors=[];
  const C=DB.seats.cols;
  if(C<2)return;
  let pos=Math.floor(C/2)-1; // 优先从中间分开
  if(DB.seats.corridors.includes(pos)){
    let placed=false;
    for(let d=1;d<C && !placed;d++){
      if(!DB.seats.corridors.includes(pos-d) && pos-d>=0){pos=pos-d;placed=true;}
      else if(!DB.seats.corridors.includes(pos+d) && pos+d<=C-2){pos=pos+d;placed=true;}
    }
    if(!placed)return;
  }
  DB.seats.corridors.push(pos);
  DB.seats.corridors.sort((a,b)=>a-b);
}
/* 像 Excel 插入一行：在座位网格中追加一条横向讲台行（全局，不占座位） */
function addPodium(){
  if(!DB.seats.podiums)DB.seats.podiums=[];
  const R=DB.seats.rows;
  if(R<1)return;
  let pos=-1; // 默认教室最前方
  if(DB.seats.podiums.includes(pos)){
    pos=Math.floor(R/2)-1;
    let placed=false;
    for(let d=1;d<R+2 && !placed;d++){
      if(!DB.seats.podiums.includes(pos-d) && pos-d>=-1 && pos-d<=R-1){pos=pos-d;placed=true;}
      else if(!DB.seats.podiums.includes(pos+d) && pos+d>=-1 && pos+d<=R-1){pos=pos+d;placed=true;}
    }
    if(!placed)return;
  }
  DB.seats.podiums.push(pos);
  DB.seats.podiums.sort((a,b)=>a-b);
}

    if(pods.includes(r-1))rt+=' 34px';
    rt+=' 1fr';
  }
  if(pods.includes(DB.seats.rows-1))rt+=' 34px';
  g.style.gridTemplateRows=rt;
  renderSeatOverlays();
  applyBlockedOverlay(g);
}
/* 走廊/讲台覆盖的座位格：中心点落入覆盖矩形则视为被挡，标记 .blocked、清掉里面的学生映射、禁止 drop */
function applyBlockedOverlay(g){
  if(!g)g=$('#seatGrid');if(!g)return;
  const overlays=g.querySelectorAll('.seat-overlay');
  if(!overlays.length)return;
  const seats=g.querySelectorAll('.seat[data-key]');
  const layout=curSeatLayout();
  let changed=false;
  seats.forEach(seat=>{
    const sr=seat.getBoundingClientRect();
    let hit=false;
    overlays.forEach(ov=>{
      const r=ov.getBoundingClientRect();
      const cx=sr.left+sr.width/2;
      const cy=sr.top+sr.height/2;
      if(cx>=r.left && cx<=r.right && cy>=r.top && cy<=r.bottom)hit=true;
    });
    if(hit){
      seat.classList.add('blocked');
      seat.removeAttribute('draggable');
      seat.removeAttribute('data-sid');
      seat.textContent='';
      const key=seat.dataset.key;
      if(layout[key]){delete layout[key];changed=true;}
    }
  });
  if(changed)save();
}
let seatDragSrc=null;
function seatDragStart(e,el){
  if(el.dataset.stuid){seatDragSrc={type:'pool',sid:el.dataset.stuid};}
  else{seatDragSrc={type:'seat',key:el.dataset.key,sid:el.dataset.sid};}
  e.dataTransfer.effectAllowed='move';
  try{e.dataTransfer.setData('text/plain',el.dataset.key||el.dataset.stuid);}catch(_){}
}
function seatDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';}
function seatDrop(e,el){
  e.preventDefault();if(!seatDragSrc)return;
  if(el.classList.contains('blocked')){seatDragSrc=null;return;}
  const key=el.dataset.key;
  const layout=curSeatLayout();
  if(seatDragSrc.type==='pool'){
    if(layout[key]){/* 占位者自动回池 */} layout[key]=seatDragSrc.sid;
  }else{
    const from=seatDragSrc.key;const tmp=layout[key];
    layout[key]=layout[from];
    if(tmp)layout[from]=tmp;else delete layout[from];
  }
  seatDragSrc=null;save();renderSeatGrid();renderSeatPool();
}
function seatUnassign(e,el){
  e.preventDefault();if(seatDragSrc&&seatDragSrc.type==='seat'){delete curSeatLayout()[seatDragSrc.key];seatDragSrc=null;save();renderSeatGrid();renderSeatPool();}
}

/* 走廊 / 讲台（可多个）：list 模型，按班级独立保存到 DB.seats.layouts[cls].overlays.list */
function defaultSeatOverlayPos(kind){
  if(kind==='corridor')return {left:45.5,top:0,width:9,height:100}; // 竖向中部通道
  if(kind==='podium')return {left:30,top:0,width:40,height:11};    // 顶部讲台
  return {left:0,top:0,width:30,height:15};
}
function overlaysList(){return curSeatLayout().overlays.list;}
function addOverlay(type){
  const lay=curSeatLayout();
  const same=lay.overlays.list.filter(o=>o.type===type);
  const d=defaultSeatOverlayPos(type);
  let left=d.left,top=d.top;
  if(type==='corridor'){
    const stride=11; left=(same.length*stride)%Math.max(11,100-d.width);
  }else if(type==='podium'){
    const stride=13; top=(same.length*stride)%Math.max(13,100-d.height);
  }
  lay.overlays.list.push({
    id:(type==='corridor'?'co':'po')+Date.now().toString(36)+Math.floor(Math.random()*9999),
    type,label:type==='corridor'?'走廊':'讲台',
    left,top,width:d.width,height:d.height,
  });
  save();renderSeatGrid();
}
function removeOverlay(id){
  const lay=curSeatLayout();
  lay.overlays.list=lay.overlays.list.filter(o=>o.id!==id);
  save();renderSeatGrid();
}
function moveOverlay(id,left,top){
  const lay=curSeatLayout();
  const o=lay.overlays.list.find(x=>x.id===id);
  if(o){o.left=left;o.top=top;save();}
}
function resetOverlay(id){
  const lay=curSeatLayout();
  const o=lay.overlays.list.find(x=>x.id===id);
  if(o){const d=defaultSeatOverlayPos(o.type);Object.assign(o,d);o.label=o.type==='corridor'?'走廊':'讲台';save();renderSeatGrid();}
}
function renderSeatOverlays(){
  const g=$('#seatGrid');if(!g)return;
  // 清旧（避免层级累积）
  g.querySelectorAll('.seat-overlay').forEach(e=>e.remove());
  overlaysList().forEach(o=>{
    if(o.type==='corridor'||o.type==='podium')return; // 走廊/讲台已改为网格列/行，不以覆盖层呈现
    const el=document.createElement('div');
    el.className='seat-overlay '+o.type;
    el.dataset.id=o.id;
    el.dataset.type=o.type;
    el.style.left=o.left+'%';
    el.style.top=o.top+'%';
    el.style.width=o.width+'%';
    el.style.height=o.height+'%';
    el.textContent=o.label||(o.type==='corridor'?'走廊':'讲台');
    el.title=(o.label||o.type)+'：拖动调整位置；双击复位；点击右上角 × 删除';
    // ✕ 删除按钮
    const x=document.createElement('span');
    x.className='seat-overlay-x';
    x.textContent='×';
    x.title='删除此元素';
    el.appendChild(x);
    // 双击复位到默认位置（保留 type/label）
    el.addEventListener('dblclick',e=>{
      e.preventDefault();e.stopPropagation();
      resetOverlay(o.id);
    });
    g.appendChild(el);
  });
}
/* 走廊/讲台拖动：mousedown 启动、document 监听 mousemove/mouseup（仅注册一次） */
let seatOvDrag=null;
function bindSeatOverlayDrag(){
  const g=$('#seatGrid');
  if(!g)return;
  // 座位格内拖入逻辑已用 ondragover，避免被覆盖层抢走——只响应纯鼠标（mousedown）
  g.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('seat-overlay-x'))return; // ✕ 按钮不触发拖动
    const ov=e.target.closest('.seat-overlay');
    if(!ov)return;
    e.preventDefault();e.stopPropagation();
    const rect=g.getBoundingClientRect();
    const lay=curSeatLayout();
    const o=lay.overlays.list.find(x=>x.id===ov.dataset.id);
    if(!o)return;
    seatOvDrag={
      el:ov,
      id:o.id,
      rect,
      startX:e.clientX,
      startY:e.clientY,
      origLeft:o.left,
      origTop:o.top,
      w:o.width,
      h:o.height,
    };
    ov.classList.add('dragging');
    document.body.style.userSelect='none';
  });
}
document.addEventListener('mousemove',e=>{
  if(!seatOvDrag)return;
  const rect=seatOvDrag.rect;
  const dx=(e.clientX-seatOvDrag.startX)/rect.width*100;
  const dy=(e.clientY-seatOvDrag.startY)/rect.height*100;
  const nl=Math.max(0,Math.min(100-seatOvDrag.w,seatOvDrag.origLeft+dx));
  const nt=Math.max(0,Math.min(100-seatOvDrag.h,seatOvDrag.origTop+dy));
  seatOvDrag.el.style.left=nl+'%';
  seatOvDrag.el.style.top=nt+'%';
});
document.addEventListener('mouseup',e=>{
  if(!seatOvDrag)return;
  const id=seatOvDrag.id;
  const nl=parseFloat(seatOvDrag.el.style.left);
  const nt=parseFloat(seatOvDrag.el.style.top);
  moveOverlay(id,nl,nt);
  seatOvDrag.el.classList.remove('dragging');
  document.body.style.userSelect='';
  seatOvDrag=null;
});

/* 把姓名转为小写拼音连接串（如「张文」→「zhangwen」），用于按字母检索 */
function namePinyin(name){
  if(!name)return'';
  let s='';
  for(const ch of name){
    if(PY[ch]){s+=PY[ch];}
    else if(/[a-zA-Z]/.test(ch)){s+=ch.toLowerCase();}
  }
  return s;
}
/* 把姓名转为拼音首字母连写（如「吕发权」→「lfq」），用于首字母选人 */
function nameInitials(name){
  if(!name)return'';
  let s='';
  for(const ch of name){
    if(PY[ch]){s+=PY[ch][0];}
    else if(/[a-zA-Z]/.test(ch)){s+=ch.toLowerCase();}
  }
  return s;
}

  /* 按字母 / 拼音 / 学号筛选 */

  if(q){
    show=active.filter(s=>{
      const cache=(s.name+' '+(s.no||'')+' '+namePinyin(s.name)+' '+nameInitials(s.name)).toLowerCase();
      return cache.includes(q);
    });
  }
  if(!show.length){box.innerHTML='<div class="muted" style="padding:18px;text-align:center">没有匹配「<b>'+esc(q)+'</b>」的学生</div>';return;}
  const cells=[];

  const stOf=new Map();
  show.forEach(s=>{
    let st='present';
    if(atState.absent.includes(s.id))st='absent';
    else if(atState.late.includes(s.id))st='late';
    stOf.set(s.id,st);
  });
  show.forEach((s,i)=>{
    const st=stOf.get(s.id);
    const ini=nameInitials(s.name);
    const sub=(s.no?esc(s.no):'')+(ini?' · '+esc(ini):'');
    cells.push(`<div class="stu-cell at-cell st-${st}" data-action="at-set" data-id="${s.id}" data-st="${st}" title="${esc(s.name)}（点击循环：出勤 → 迟到 → 缺席）">

      </span>
    </div>`);
  });
  /* 凑齐 8 的倍数，让最末行不留半个空 */
  const remainder=cells.length%8;
  if(remainder){
    const pad=8-remainder;

  let suggest=`本次试卷共分析 ${kp.length} 个知识点，其中得分率低于 60% 的薄弱知识点 ${weak.length} 个：\n`;
  if(weak.length){

    suggest+='改进建议：\n1. 针对薄弱知识点进行专题复习与专项训练；\n2. 设计变式练习，强化易错环节；\n3. 关注学困生，实施一对一帮扶；\n4. 两周后安排跟踪测验检验巩固效果。';
  }else{

  }
  DB.exams.push({id:uid(),paper:true,name,date:new Date().toISOString().slice(0,10),kp,suggest});

  kp.forEach(k=>{

  showView('knowledge');
}

function computeStats(scores){
  const n=scores.length;if(!n)return null;
  const sum=scores.reduce((a,b)=>a+b,0);
  const avg=sum/n;
  const max=Math.max(...scores),min=Math.min(...scores);
  const variance=scores.reduce((a,b)=>a+(b-avg)*(b-avg),0)/n;
  const std=Math.sqrt(variance);
  const pass=scores.filter(s=>s>=60).length/n*100;
  const excellent=scores.filter(s=>s>=85).length/n*100;
  const low=scores.filter(s=>s<60).length/n*100;
  return {n,avg,max,min,std,pass,excellent,low};
}

  html=`<div class="card" style="background:var(--card);display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;margin-bottom:12px">

function drawHistogram(cv,counts){
  if(!cv)return;const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height,pad=40;const max=Math.max(...counts,1);
  ctx.clearRect(0,0,W,H);
  const cStyle=getComputedStyle(document.documentElement);
  const text=cStyle.getPropertyValue('--text').trim()||'#333';
  const muted=cStyle.getPropertyValue('--muted').trim()||'#888';
  const primary=cStyle.getPropertyValue('--primary').trim()||'#2e9e5b';
  ctx.fillStyle=text;ctx.font='12px sans-serif';
  const bw=(W-pad*2)/counts.length;
  counts.forEach((c,i)=>{
    const h=(H-pad*2)*c/max;const x=pad+i*bw;const y=H-pad-h;
    ctx.fillStyle=primary;ctx.fillRect(x+4,y,bw-8,h);
    ctx.fillStyle=muted;ctx.textAlign='center';ctx.fillText(c,x+bw/2,y-4);
    ctx.fillStyle=text;ctx.fillText((i*10)+'-'+(i*10+10),x+bw/2,H-pad+16);
  });
  // 轴
  ctx.strokeStyle=muted;ctx.beginPath();ctx.moveTo(pad,H-pad);ctx.lineTo(W-pad,H-pad);ctx.stroke();
  ctx.fillStyle=text;ctx.textAlign='left';ctx.fillText('人数',6,18);
}

/* ============================================================
   模块：成长曲线（班级各科走势 + 全班成绩对比 + 学生个人成长）
   ============================================================ */
const TREND_COLORS=['#2e9e5b','#3a8ee6','#e35b5b','#f0a020','#9c6cf5','#16a3a3','#d65ba5','#5b6dd6'];
function drawLineChart(cv,series,opts){
  if(!cv)return;
  const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height,pad={l:42,r:18,t:18,b:32};
  const pW=W-pad.l-pad.r,pH=H-pad.t-pad.b;
  ctx.clearRect(0,0,W,H);
  const cStyle=getComputedStyle(document.documentElement);
  const text=cStyle.getPropertyValue('--text').trim()||'#333';
  const muted=cStyle.getPropertyValue('--muted').trim()||'#888';
  const grid=cStyle.getPropertyValue('--border').trim()||'#eee';

  const yMin=opts.yMin??0,yMax=opts.yMax??100;
  const xLabels=opts.xLabels||[];

  // 网格 + Y 轴刻度
  ctx.strokeStyle=grid;ctx.lineWidth=1;
  ctx.fillStyle=muted;ctx.font='11px sans-serif';ctx.textAlign='right';
  for(let v=yMin;v<=yMax;v+=25){
    const y=pad.t+pH-(v-yMin)/(yMax-yMin)*pH;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillText(v,pad.l-6,y+4);
  }

  // X 轴标签（避免拥挤，最多显示 6 个）
  ctx.textAlign='center';
  const step=xLabels.length>6?Math.ceil(xLabels.length/6):1;
  xLabels.forEach((lbl,i)=>{
    if(i%step!==0&&i!==xLabels.length-1)return;
    const x=pad.l+(xLabels.length>1?i/(xLabels.length-1)*pW:pW/2);
    ctx.fillText((lbl||'').slice(5),x,H-pad.b+16); // 显示 MM-DD
  });

  // 系列折线 + 数据点 + 数值
  series.forEach((s,si)=>{
    const color=opts.color||TREND_COLORS[si%TREND_COLORS.length];
    const pts=s.points.filter(p=>p.y!==null&&!isNaN(p.y));
    if(!pts.length)return;
    ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.lineJoin='round';
    ctx.beginPath();
    pts.forEach((p,i)=>{
      const x=pad.l+(pts.length>1?i/(pts.length-1)*pW:pW/2);
      const y=pad.t+pH-(p.y-yMin)/(yMax-yMin)*pH;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();

    // 数据点 + 数值
    ctx.fillStyle=color;
    pts.forEach((p,i)=>{
      const x=pad.l+(pts.length>1?i/(pts.length-1)*pW:pW/2);
      const y=pad.t+pH-(p.y-yMin)/(yMax-yMin)*pH;
      ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
      ctx.font='bold 11px sans-serif';ctx.fillStyle=text;ctx.textAlign='center';
      ctx.fillText(Math.round(p.y),x,y-9);
      ctx.fillStyle=color;
    });
  });

  // X 轴
  ctx.strokeStyle=muted;ctx.beginPath();ctx.moveTo(pad.l,H-pad.b);ctx.lineTo(W-pad.r,H-pad.b);ctx.stroke();
}

function getTrendExams(){
  return DB.exams.filter(e=>!e.paper).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}
function getTrendSubjects(exams){
  const s=new Set();
  exams.forEach(e=>e.subjects.forEach(x=>s.add(x)));
  return [...s];
}
function trendBadge(curr,prev,unit){
  if(curr==null||prev==null)return '<span class="tag" style="background:var(--chip);color:var(--muted)">暂无</span>';
  const diff=curr-prev;
  if(Math.abs(diff)<0.5)return '<span class="tag" style="background:var(--chip);color:var(--muted)">持平</span>';
  const cls=diff>0?'green':'red';
  return `<span class="tag ${cls}">${diff>0?'↑':'↓'} ${Math.abs(diff).toFixed(1)}${unit||'分'}</span>`;
}

/* 表格里 [data-act=stu-goto] 委托：点击姓名 → 跳到个人成长曲线
   在 root（如 #classTable / #boardOut）上挂一次事件委托，root 内部任何 [data-act=stu-goto] 都触发
   - 若当前页已有 #stuPick（成长曲线页）：直接选中学生+渲染
   - 若没有（成绩看板页）：先切到成长曲线 tab 并 renderTrend，再选中学生 */
function attachStuGoto(root){
  if(!root || root.dataset.gotoBound)return;
  root.addEventListener('click',e=>{
    const a=e.target.closest('[data-act=stu-goto]');if(!a)return;
    e.preventDefault();
    const sid=a.dataset.sid;
    const nameText=a.textContent.trim();
    const doPick=()=>{
      const pick=$('#stuPick');
      if(!pick)return;
      if(![...pick.options].some(o=>o.value===sid)){
        const opt=document.createElement('option');opt.value=sid;opt.textContent=nameText;pick+opt;
      }
      pick.value=sid;
      renderStuArea(sid);
      const area=$('#stuArea');if(area)area.scrollIntoView({behavior:'smooth',block:'start'});
    };
    const pick=$('#stuPick');
    if(pick){doPick();return;}
    /* 跨页：切到成长曲线 tab 并触发 renderTrend，再选中学生 */
    const trendTab=document.querySelector('[data-tab=trend]');
    if(trendTab){
      trendTab.click();
      if(typeof renderTrend==='function')renderTrend();
      setTimeout(doPick,60);
    }
  });
  root.dataset.gotoBound='1';
}

function renderClassCurve(subj){
  const box=$('#classCurve');if(!box)return;
  const exams=getTrendExams();

  // 计算每场考试该科目全班均分
  const pts=exams.map(ex=>{
    const arr=ex.students.map(s=>+(s.subjects[subj]||0)).filter(v=>v>0);
    const avg=arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
    return {date:ex.date,name:ex.name,y:avg};
  });

  const latest=pts[pts.length-1];
  const prev=pts[pts.length-2];
  const badge=trendBadge(latest&&latest.y,prev&&prev.y);

  box.innerHTML=`
  <div class="row between" style="margin-bottom:8px;align-items:center">
    <div style="font-size:18px;font-weight:700">${esc(subj)}</div>
    <div>最新 ${latest?latest.y.toFixed(1):'--'} ${badge}</div>
  </div>
  <canvas id="classCurveCv" width="720" height="220"></canvas>
  <div class="muted" style="margin-top:6px;font-size:12px">${pts.map(p=>`${p.date} 均分 ${p.y.toFixed(1)}`).join('  ·  ')}</div>`;

  const cv=$('#classCurveCv');
  drawLineChart(cv,[{label:subj,points:pts}],{yMin:0,yMax:100,xLabels:pts.map(p=>p.date)});
}

function renderClassTable(ex){
  const box=$('#classTable');if(!box||!ex)return;

  // 各科均分
  const subjAvg={};
  ex.subjects.forEach(s=>{
    const arr=ex.students.map(x=>+(x.subjects[s]||0));
    subjAvg[s]=arr.reduce((a,b)=>a+b,0)/arr.length;
  });
  const overallAvg=ex.subjects.reduce((a,s)=>a+subjAvg[s],0)/ex.subjects.length;

  // 分数段分布
  const buckets={'<60':0,'60-69':0,'70-79':0,'80-89':0,'≥90':0};
  ex.students.forEach(s=>{
    const t=ex.subjects.reduce((a,sub)=>a+(s.subjects[sub]||0),0);
    const avg=t/ex.subjects.length;
    if(avg<60)buckets['<60']++;
    else if(avg<70)buckets['60-69']++;
    else if(avg<80)buckets['70-79']++;
    else if(avg<90)buckets['80-89']++;
    else buckets['≥90']++;
  });
  const total=ex.students.length;

  // 单元格颜色
  const cellCls=v=>v>=85?'cell-good':v>=75?'':v>=60?'cell-mid':'cell-bad';

  let html=`
  <div class="row" style="margin-bottom:12px;gap:24px;flex-wrap:wrap;align-items:flex-end">
    <div><div class="big-num">${overallAvg.toFixed(1)}</div><div class="big-num-lbl">全班均分（${esc(ex.name)}）</div></div>
    <div class="muted" style="font-size:13px">${total} 人参考 · 满分 ${ex.subjects.length*100}</div>
  </div>

  <div class="row" style="margin-bottom:14px;gap:8px;flex-wrap:wrap">
    ${Object.entries(buckets).map(([k,v])=>{
      const cls=k==='<60'?'cell-bad':k==='≥90'?'cell-good':'';
      const pct=total?(v/total*100):0;
      return `<div style="display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:10px">
        <span style="font-weight:700">${k}</span>
        <span class="${cls}" style="padding:2px 8px;border-radius:6px">${v} 人</span>
        <span class="muted" style="font-size:12px">${pct.toFixed(0)}%</span>
      </div>`;
    }).join('')}
  </div>

  <div class="scroll-x"><table class="tb"><thead><tr>
    <th>排名</th><th>姓名</th>
    ${ex.subjects.map(s=>`<th>${esc(s)}<br><span class="muted" style="font-size:11px">均 ${subjAvg[s].toFixed(1)}</span></th>`).join('')}
    <th>总分</th><th>均分</th>
  </tr></thead><tbody>`;

  // 按总分排序
  const ranked=ex.students.slice().map(s=>{
    const total=ex.subjects.reduce((a,sub)=>a+(s.subjects[sub]||0),0);
    return {...s,_total:total,_avg:total/ex.subjects.length};
  }).sort((a,b)=>b._total-a._total);

  ranked.forEach((s,idx)=>{
    html+=`<tr>
      <td>${idx+1}</td>
      <td><a href="#" class="stu-link" data-action="stu-goto" data-sid="${esc(s.id)}" title="点击查看该学生的个人成长曲线"><b>${esc(s.name)}</b></a></td>
      ${ex.subjects.map(sub=>{
        const v=s.subjects[sub]||0;
        return `<td class="${cellCls(v)}">${v}</td>`;
      }).join('')}
      <td><b>${s._total}</b></td>
      <td class="${cellCls(s._avg)}">${s._avg.toFixed(1)}</td>
    </tr>`;
  });
  html+=`</tbody></table></div>`;

  box.innerHTML=html;
  const metaBox=$('#trendExamMeta');if(metaBox)metaBox.textContent=`${ex.subjects.length} 科 · ${total} 人`;
}

function renderStuArea(sid){
  const box=$('#stuArea');const btn=$('#exportStuCurveBtn');
  if(!sid){
    box.innerHTML='<div class="empty"><div class="big">👤</div>选个学生查看他的各科成长曲线</div>';
    if(btn)btn.disabled=true;
    return;
  }
  if(btn)btn.disabled=false;
  const stu=DB.students.find(s=>s.id===sid);
  if(!stu){box.innerHTML='<div class="muted">学生不存在</div>';return;}
  const exams=getTrendExams();
  const subjects=getTrendSubjects(exams);

  // 各科序列（按场次）
  const series=subjects.map(subj=>{
    const points=exams.map(ex=>{
      const stEx=ex.students.find(x=>x.id===sid);
      return {date:ex.date,name:ex.name,y:stEx?(+(stEx.subjects[subj]||0)||null):null};
    }).filter(p=>p.y!==null);
    return {subj,points};
  }).filter(s=>s.points.length>0);

  const initial=(stu.name||'?')[0];

  let html=`
  <div class="stu-header">
    <div class="avatar">${esc(initial)}</div>
    <div class="info">
      <div class="nm">${esc(stu.name)}</div>
      <div class="sub">已参加 ${exams.length} 场考试 · ${subjects.length} 个科目</div>
    </div>
  </div>
  <div id="stuCurves">`;

  series.forEach(({subj,points})=>{
    const latest=points[points.length-1];
    const prev=points[points.length-2];
    html+=`
    <div class="subj-curve-card">
      <div class="row between" style="margin-bottom:8px;align-items:center">
        <div style="font-size:16px;font-weight:700">${esc(subj)}</div>
        <div>最新 ${latest?latest.y:'--'} ${trendBadge(latest&&latest.y,prev&&prev.y)}</div>
      </div>
      <canvas class="stu-cv" data-sub="${esc(subj)}" width="680" height="160"></canvas>
      <div class="muted" style="margin-top:6px;font-size:12px">${points.map(p=>`${p.date} ${p.y}`).join('  ·  ')}</div>
    </div>`;
  });

  html+=`</div>
  <div class="section-h" style="margin-top:14px">${esc(stu.name)} · 历次成绩明细</div>
  <div class="scroll-x"><table class="tb"><thead><tr><th>考试</th><th>日期</th>
    ${subjects.map(s=>`<th>${esc(s)}</th>`).join('')}
    <th>总分</th><th>均分</th>
  </tr></thead><tbody>`;

  exams.forEach(ex=>{
    const stEx=ex.students.find(x=>x.id===sid);
    if(!stEx)return;
    const total=ex.subjects.reduce((a,sub)=>a+(stEx.subjects[sub]||0),0);
    const avg=total/ex.subjects.length;
    html+=`<tr>
      <td>${esc(ex.name)}</td>
      <td>${ex.date}</td>
      ${subjects.map(sub=>{
        const v=stEx.subjects[sub];
        if(v==null)return '<td><span class="muted">-</span></td>';
        const cls=v>=85?'cell-good':v>=75?'':v>=60?'cell-mid':'cell-bad';
        return `<td class="${cls}">${v}</td>`;
      }).join('')}
      <td><b>${total}</b></td>
      <td class="${avg>=85?'cell-good':avg>=60?'cell-mid':'cell-bad'}">${avg.toFixed(1)}</td>
    </tr>`;
  });
  html+=`</tbody></table></div>`;

  box.innerHTML=html;

  // 绘制所有学生曲线
  $$('.stu-cv',box).forEach(cv=>{
    const subj=cv.dataset.sub;
    const s=series.find(x=>x.subj===subj);
    if(s)drawLineChart(cv,[{label:subj,points:s.points}],{yMin:0,yMax:100,xLabels:s.points.map(p=>p.date)});
  });
}

// 已验证春节日期（网页核实，锚点法提高精度）
const CNY_ANCHORS={1900:[1,30],1989:[2,6],1990:[1,27],2000:[2,5],2020:[1,25],2021:[2,12],2022:[2,1],2023:[1,22],2024:[2,10],2025:[1,29],2026:[2,17]};
const LMN=['','正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
const LDN=['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
const TZT='甲乙丙丁戊己庚辛壬癸',SZZ='子丑寅卯辰巳午未申酉戌亥';
function _lym(y){return LUNAR_DATA[y-1900]&0xf;}
function _lmd(y,m){const lm=_lym(y);const shift=(lm>0&&m>lm)?m-1:m;return(LUNAR_DATA[y-1900]&(0x10000>>shift))?30:29;}
function _lyd(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=(LUNAR_DATA[y-1900]&i)?1:0;const lm=_lym(y);if(lm>0){s+=29;s+=(LUNAR_DATA[y-1900]&(0x10000>>lm))?1:0;}return s;}
function solarToLunar(y,m,d){
  if(y<1900||y>2099)return null;
  const target=new Date(y,m-1,d);target.setHours(0,0,0,0);
  // 找最近的已验证春节锚点
  let ay=1900;const yrs=Object.keys(CNY_ANCHORS).map(Number).sort((a,b)=>a-b);
  for(const a of yrs){const[am,ad]=CNY_ANCHORS[a];if(new Date(a,am-1,ad)<=target)ay=a;else break;}
  const[am,ad]=CNY_ANCHORS[ay];
  let off=Math.floor((target-new Date(ay,am-1,ad))/86400000);
  let ly=ay;
  for(;ly<2100;ly++){const tmp=_lyd(ly);if(off<tmp)break;off-=tmp;}
  const lp=_lym(ly);let iM,leap=0;
  for(iM=1;iM<14;iM++){if(lp>0&&iM===lp+1&&!leap){iM--;leap=1;}const tmp=_lmd(ly,iM);if(off<tmp)break;off-=tmp;}
  const ld=off+1;
  if(ld<1||ld>30)return null;
  return{ly,lm:iM,ld};
}
function lunarFullStr(l){
  if(!l)return'';
  const gz=TZT[(l.ly-4)%10]+SZZ[(l.ly-4)%12];
  return gz+'年 '+LMN[l.lm]+LDN[l.ld];
}
function lunarDayStr(l){
  if(!l)return'';return LDN[l.ld]||'';
}

/* 日历弹窗（含农历 + 点击日期添加待办） */
let calState={y:1900,m:0};
function openCalendar(y,m){
  if(y===undefined){const now=new Date();y=now.getFullYear();m=now.getMonth();}
  calState.y=y;calState.m=m;
  const first=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();
  const todayStr=new Date().toISOString().slice(0,10);
  let cells='';
  for(let i=0;i<(first===0?6:first-1);i++)cells+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const l=solarToLunar(y,m+1,d);
    const lunarText=l?lunarDayStr(l):'';
    const lunarFull=l?lunarFullStr(l):'';
    const has=DB.todos.filter(t=>!t.done&&!t.archived&&t.deadline===ds).length;
    cells+=`<div class="cal-day" data-date="${ds}" data-lunar="${lunarFull}" onclick="openAddTodoModal('${ds}','${lunarFull}')" style="border:1px solid var(--border);border-radius:8px;padding:6px 4px;min-height:56px;background:${ds===todayStr?'var(--chip)':'var(--card)'};cursor:pointer;text-align:center">
      <div style="font-weight:700;font-size:14px">${d}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px;line-height:1.2">${lunarText}</div>
      ${has?`<div class="tag red" style="margin-top:3px;font-size:10px">${has}</div>`:''}</div>`;
  }
  const due=DB.todos.filter(t=>!t.done&&!t.archived&&t.deadline&&t.deadline<todayStr);
  openModal(`<h3>📅 ${y}年 ${m+1}月 <span style="font-size:13px;color:var(--muted);font-weight:400">（点击日期添加待办）</span></h3>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0">
      ${['一','二','三','四','五','六','日'].map(x=>`<div style="text-align:center;font-weight:700;color:var(--muted);font-size:12px">${x}</div>`).join('')}
      ${cells}</div>
    ${due.length?`<div class="muted" style="font-size:12px">⚠️ 已逾期待办 ${due.length} 项，请及时跟进。</div>`:'<div class="muted" style="font-size:12px">无逾期待办，继续保持～</div>'}
    <div class="actions"><button class="btn" data-action="cal-prev">◀ 上月</button><button class="btn primary" data-action="cal-today">今天</button><button class="btn" data-action="cal-next">下月 ▶</button></div>`);
}

  openModal(`

/* ============================================================
   通用 tab 绑定
   ============================================================ */
function bindTabs(root){
  $$('.tab',root).forEach(t=>t.addEventListener('click',()=>{
    const tc=t.dataset.tab;
    $$('.tab',root).forEach(x=>x.classList.toggle('active',x===t));
    $$('.tab-content',root).forEach(c=>c.classList.toggle('active',c.dataset.tc===tc));
  }));
}

/* ============================================================
   全局事件委托（处理各模块按钮）
   ============================================================ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-action]');if(!el)return;
  // data-act 与 data-action 均在此统一处理（主题/导出等已在上层 handleAction 处理，无匹配时为空操作）
  const act=el.dataset.act||el.dataset.action;if(!act)return;

  /* ---- 待办 ---- */
  if(act==='add-todo'){
    const title=$('#todoTitle').value.trim();if(!title){toast('请输入待办内容');return;}
    DB.todos.push({id:uid(),title,deadline:$('#todoDate').value,tag:$('#todoTag').value,done:false,archived:false,createdAt:Date.now()});
    save();$('#todoTitle').value='';renderTodoList();return;
  }
  if(act==='toggle'){const id=el.closest('.item').dataset.id;const t=DB.todos.find(x=>x.id===id);t.done=!t.done;save();refreshTodoModal();renderHomeReminder();return;}
  if(act==='archive'){const id=el.closest('.item').dataset.id;DB.todos.find(x=>x.id===id).archived=true;save();refreshTodoModal();renderHomeReminder();return;}
  if(act==='del'){const id=el.closest('.item').dataset.id;DB.todos=DB.todos.filter(x=>x.id!==id);save();refreshTodoModal();renderHomeReminder();return;}

  /* ---- 日历 ---- */
  if(act==='cal-prev'){calState.m--;if(calState.m<0){calState.m=11;calState.y--;}openCalendar(calState.y,calState.m);return;}
  if(act==='cal-next'){calState.m++;if(calState.m>11){calState.m=0;calState.y++;}openCalendar(calState.y,calState.m);return;}
  if(act==='cal-today'){const now=new Date();openCalendar(now.getFullYear(),now.getMonth());return;}
  if(act==='cal-add-todo'){
    const title=$('#calTodoTitle').value.trim();
    if(!title){toast('请输入待办内容');return;}
    DB.todos.push({id:uid(),title,deadline:el.dataset.date,tag:$('#calTodoTag').value,done:false,archived:false,createdAt:Date.now()});
    save();toast('✅ 已添加待办');closeModal();openCalendar(calState.y,calState.m);return;
  }

  /* ---- 话术 ---- */
  if(act==='ph-add'||act==='ct-ph-add'){openPhModal();return;}
  if(act==='fav'){const id=el.closest('.item').dataset.id;const p=DB.phrases.find(x=>x.id===id);p.fav=!p.fav;save();renderPhList();renderQuickPhrases();renderPhMList();return;}
  if(act==='copy'){const id=el.closest('.item').dataset.id;const p=DB.phrases.find(x=>x.id===id);if(p)copyText(p.content);return;}
  if(act==='ph-del'){const id=el.closest('.item').dataset.id;DB.phrases=DB.phrases.filter(x=>x.id!==id);save();renderPhList();renderQuickPhrases();renderPhMList();return;}
  if(act==='ph-fav-filter'){phFavOnly=!phFavOnly;renderPhList();renderPhMList();return;}

  /* ---- AI ---- */
  if(act==='ai-gen'){aiGenerate();return;}
  if(act==='ai-copy'){copyText($('#aiOut').value);return;}
  if(act==='ai-save'){
    const out=$('#aiOut').value.trim();if(!out){toast('请先生成内容');return;}
    DB.phrases.push({id:uid(),title:$('#aiType').value+' · '+($('#aiDesc').value.trim().slice(0,12)||'生成'),content:out,tags:['其他'],fav:false,createdAt:Date.now()});
    save();renderPhList();renderQuickPhrases();renderPhMList();toast('已保存到话术库');return;
  }
  if(act==='quick-ph'||el.dataset.ph){
    const id=el.dataset.ph;if(id){const p=DB.phrases.find(x=>x.id===id);if(p)copyText(p.content);}return;
  }

  /* ---- 应急 ---- */
  if(act==='em-add-contact'){openEmContactModal();return;}
  if(act==='em-add-flow'){openEmFlowModal();return;}
  if(act==='em-add-info'){openEmInfoModal();return;}
  if(act==='em-del-c'){DB.emergency.contacts=DB.emergency.contacts.filter(x=>x.id!==el.dataset.id);save();renderEmAll();renderEmContact();return;}
  if(act==='em-del-f'){DB.emergency.flows=DB.emergency.flows.filter(x=>x.id!==el.dataset.id);save();renderEmAll();renderEmFlow();return;}
  if(act==='em-del-i'){DB.emergency.info=DB.emergency.info.filter(x=>x.id!==el.dataset.id);save();renderEmAll();renderEmInfo();return;}

  /* ---- 学生 ---- */
  if(act==='st-add'){openStModal();return;}
  if(act==='st-import'){openStImport();return;}
  if(act==='st-tpl'){downloadStudentTemplate();return;}
  if(act==='st-import-sample'){importSampleStudents();return;}
  if(act==='st-edit'){openStModal(el.dataset.id);closeStuMenu();return;}
  if(act==='st-archive'){const s=DB.students.find(x=>x.id===el.dataset.id);s.archived=true;stSel.delete(s.id);save();renderStList();closeStuMenu();return;}
  if(act==='st-del'){DB.students=DB.students.filter(x=>x.id!==el.dataset.id);stSel.delete(el.dataset.id);save();renderStList();if(typeof renderSeatPool==='function')renderSeatPool();closeStuMenu();return;}
  if(act==='st-sel'){const id=el.dataset.id;if(stSel.has(id))stSel.delete(id);else stSel.add(id);renderStList();return;}
  if(act==='st-sel-all'){const q=($('#stSearch')?.value||'').toLowerCase();DB.students.filter(s=>!s.archived&&(!q||(s.name+s.no).toLowerCase().includes(q))).forEach(s=>stSel.add(s.id));renderStList();return;}
  if(act==='st-sel-none'){stSel.clear();renderStList();return;}
  if(act==='st-actmenu'){openStuMenu(el);return;}
  if(act==='st-del-multi'){
    if(!stSel.size){toast('请先勾选要删除的学生');return;}
    const n=stSel.size;
    if(!confirm('确定删除选中的 '+n+' 名学生吗？此操作不可撤销。'))return;
    DB.students=DB.students.filter(x=>!stSel.has(x.id));
    stSel.clear();save();renderStList();
    if(typeof renderSeatPool==='function')renderSeatPool();
    toast('已删除 '+n+' 名学生');return;
  }
  if(act==='st-clear-all'){
    // 当前班级（all=全部）一键清空：学生 + 关联考勤/成绩/座位
    const target=curCls;
    const targetLabel=target==='all'?'所有班级':clsLabel(target);
    const toDel=DB.students.filter(s=>!s.archived && (target==='all' || stuCls(s)===target));
    if(!toDel.length){toast(targetLabel+' 暂无可清除的学生');return;}
    if(!confirm('确定清空「'+targetLabel+'」的全部 '+toDel.length+' 名学生吗？\n\n将同时清理这些学生的考勤记录、考试成绩与座位安排，此操作不可撤销。'))return;
    const delIds=new Set(toDel.map(s=>s.id));
    // 1) 移除学生
    DB.students=DB.students.filter(s=>!delIds.has(s.id));
    // 2) 清考勤里这些 id
    if(Array.isArray(DB.attendance)){
      DB.attendance.forEach(a=>{
        ['present','late','absent'].forEach(k=>{a[k]=(a[k]||[]).filter(x=>!delIds.has(x));});
      });
    }
    // 3) 清考试里这些 sid 的成绩（保持 exam 本身保留）
    if(Array.isArray(DB.exams)){
      DB.exams.forEach(ex=>{
        if(Array.isArray(ex.results)){
          ex.results=ex.results.filter(r=>!delIds.has(r.sid));
        }
      });
    }
    // 4) 清座位布局（被删学生在 seats.layouts 中的映射会被自然丢弃）
    if(DB.seats && DB.seats.layouts){
      Object.keys(DB.seats.layouts).forEach(cid=>{
        const L=DB.seats.layouts[cid];
        if(L && typeof L==='object'){
          Object.keys(L).forEach(k=>{if(delIds.has(L[k]))delete L[k];});
        }
      });
    }
    // 5) 清多选
    stSel.clear();
    save();
    renderStList();
    if(typeof renderSeatGrid==='function')renderSeatGrid();
    if(typeof renderSeatPool==='function')renderSeatPool();
    if(typeof renderHomeStu==='function')renderHomeStu();
    toast('已清空 '+targetLabel+' 共 '+delIds.size+' 名学生');
    return;
  }

  /* ---- 座位 ---- */
  if(act==='seat-apply'){
    DB.seats.rows=Math.max(1,+($('#seatR').value)||8);
    DB.seats.cols=Math.max(1,+($('#seatC').value)||8);
    if(!DB.seats.corridors)DB.seats.corridors=[];
    DB.seats.corridors=DB.seats.corridors.filter(p=>p>=0 && p<DB.seats.cols-1);
    if(!DB.seats.podiums)DB.seats.podiums=[];
    DB.seats.podiums=DB.seats.podiums.filter(p=>p>=-1 && p<=DB.seats.rows-1);
    save();renderSeatGrid();renderSeatPool();return;
  }
  if(act==='seat-add-corridor'){addCorridor();save();renderSeatGrid();renderSeatPool();return;}
  if(act==='seat-del-corridor'){const pos=parseInt(el.dataset.pos,10);if(!isNaN(pos))DB.seats.corridors=DB.seats.corridors.filter(p=>p!==pos);save();renderSeatGrid();renderSeatPool();return;}
  if(act==='seat-add-podium'){addPodium();save();renderSeatGrid();renderSeatPool();return;}
  if(act==='seat-del-podium'){const pos=parseInt(el.dataset.pos,10);if(!isNaN(pos))DB.seats.podiums=DB.seats.podiums.filter(p=>p!==pos);save();renderSeatGrid();renderSeatPool();return;}
  if(act==='seat-clear'){const L=curSeatLayout();for(const k in L)delete L[k];save();renderSeatGrid();renderSeatPool();return;}
  if(act==='seat-auto'){
    const active=DB.students.filter(s=>!s.archived && stuCls(s)===curCls);
    if(!active.length){toast('当前班级还没有学生，请先在学生档案添加');return;}
    const L=curSeatLayout();for(const k in L)delete L[k];
    renderSeatGrid(); // 让 applyBlockedOverlay 先打好标记（此时 L 已空,不会清学生）
    renderSeatPool();
    const blocked=new Set();
    const g2=$('#seatGrid');
    if(g2)g2.querySelectorAll('.seat.blocked[data-key]').forEach(s=>blocked.add(s.dataset.key));
    let i=0;
    for(let r=0;r<DB.seats.rows && i<active.length;r++)for(let c=0;c<DB.seats.cols && i<active.length;c++){
      const key=r+'-'+c;if(blocked.has(key))continue;L[key]=active[i++].id;
    }
    save();renderSeatGrid();renderSeatPool();toast('已自动排座（已避开讲台）');return;
  }

  /* ---- 知识点 ---- */
  if(act==='k-add'){openKModal();return;}
  if(act==='k-del'){DB.knowledge=DB.knowledge.filter(x=>x.id!==el.dataset.id);save();renderKList();return;}

  /* ---- 课程表 ---- */
  if(act==='sch-edit-head'){openSchHeadModal();return;}
  if(act==='sch-sample'){schSample();return;}
  if(act==='sch-clear'){DB.schedule.grid={};save();renderSchedule();renderHomeSched();return;}

  /* ---- 考勤 ---- */
  if(act==='at-load'){loadAtList();return;}
  if(act==='at-set'){
    const id=el.dataset.id;
    // 单元格整体点击（不是快捷按钮）→ 循环：出勤 → 迟到 → 缺席 → 出勤
    // 快捷按钮 qb 点击 → 直接设为该状态
    let st;
    if(e.target.closest && e.target.closest('.qb')){
      st=el.dataset.st; // el 在这里就是 qb
    }else{
      const cur=atState.absent.includes(id)?'absent':atState.late.includes(id)?'late':'present';
      st=cur==='present'?'late':cur==='late'?'absent':'present';
    }
    atState.present=atState.present.filter(x=>x!==id);atState.late=atState.late.filter(x=>x!==id);atState.absent=atState.absent.filter(x=>x!==id);
    atState[st==='present'?'present':st==='late'?'late':'absent'].push(id);loadAtList();return;
  }
  if(act==='at-save'){
    if(!atState.date){toast('请先选择日期');return;}
    const ex=DB.attendance.find(a=>a.date===atState.date && a.cls===curCls);
    const rec={date:atState.date,cls:curCls,present:atState.present,late:atState.late,absent:atState.absent};
    if(ex){Object.assign(ex,rec);}else DB.attendance.push(rec);
    save();renderAtHistory();toast('考勤已保存');return;
  }
  if(act==='at-del'){DB.attendance=DB.attendance.filter(a=>!(a.date===el.dataset.id && a.cls===el.dataset.cls));save();renderAtHistory();return;}

  /* ---- 归档 ---- */
  if(act==='arch-restore-todo'){DB.todos.find(x=>x.id===el.dataset.id).archived=false;save();renderArchive();return;}
  if(act==='arch-del-todo'){DB.todos=DB.todos.filter(x=>x.id!==el.dataset.id);save();renderArchive();return;}
  if(act==='arch-restore-stu'){DB.students.find(x=>x.id===el.dataset.id).archived=false;save();renderArchive();return;}
  if(act==='arch-del-stu'){DB.students=DB.students.filter(x=>x.id!==el.dataset.id);save();renderArchive();return;}

  /* ---- 试卷分析 ---- */
  if(act==='paper-add-kp'){paperKp.push({name:'',rate:0});renderPaperKp();return;}
  if(act==='paper-del-kp'){paperKp.splice(+el.dataset.i,1);renderPaperKp();return;}
  if(act==='paper-analyze'){analyzePaper();return;}
  if(act==='paper-del'){DB.exams=DB.exams.filter(x=>x.id!==el.dataset.id);save();renderPaperHistory();return;}

  /* ---- 成绩看板 ---- */
  if(act==='ex-add'){createExam();return;}
  if(act==='ex-view'){
    const ex=DB.exams.find(x=>x.id===el.dataset.id);
    const box=$('#boardOut');
    /* 已经在看这场 → 点击收起 */
    if(box && box.dataset.examId===ex.id){
      box.innerHTML='';
      delete box.dataset.examId;
      renderExList();
      toast('已收起看板');return;
    }
    /* 切到另一场 → 渲染新看板 */
    renderBoardOut(ex);
    if(box)box.dataset.examId=ex.id;
    renderExList();
    toast('已加载看板');
    /* 平滑滚到看板顶部 */
    if(box)box.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(act==='ex-collapse'){
    const box=$('#boardOut');
    if(box){box.innerHTML='';delete box.dataset.examId;}
    renderExList();
    toast('已收起看板');
    return;
  }
  if(act==='ex-del'){DB.exams=DB.exams.filter(x=>x.id!==el.dataset.id);save();renderExList();const bx=$('#boardOut');if(bx){bx.innerHTML='';delete bx.dataset.examId;}return;}
  /* ---- 分层学情：点击切换展开 ---- */
  if(act==='layer-toggle'){
    const layer=el.dataset.layer;
    const detail=$(`#layerDetail-${layer}`);
    if(!detail)return;
    const willShow=detail.hasAttribute('hidden');
    /* 先收起所有 */
    $$('.layer-detail').forEach(d=>d.setAttribute('hidden',''));
    $$('.layer-card').forEach(c=>c.classList.remove('active'));
    if(willShow){
      detail.removeAttribute('hidden');
      el.classList.add('active');
      detail.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
    return;
  }
  /* ---- 成绩看板：点击"科目 chip"展开低于均分的学生 ---- */
  if(act==='weak-show'){
    e.preventDefault();
    const subj=el.dataset.subj;
    const detail=$('#weakDetail');
    if(!detail)return;
    const willShow=detail.hasAttribute('hidden') || detail.dataset.subj!==subj;
    /* 收起所有 chip 高亮 */
    $$('.weak-chip').forEach(c=>{c.classList.remove('active');});
    detail.hidden=true;
    detail.innerHTML='';
    if(willShow){
      window.renderWeakDetail(subj);
      detail.dataset.subj=subj;
      el.classList.add('active');
      detail.scrollIntoView({behavior:'smooth',block:'nearest'});
    }else{
      delete detail.dataset.subj;
    }
    return;
  }
  if(act==='weak-hide'){
    const detail=$('#weakDetail');if(detail){detail.hidden=true;detail.innerHTML='';delete detail.dataset.subj;}
    $$('.weak-chip').forEach(c=>c.classList.remove('active'));
    return;
  }
  /* ---- 强弱判定标准：重置全部为 85 / 60 ---- */
  if(act==='rule-reset'){
    RULES={default:{strong:85,weak:60},perSubject:{}};saveRules();
    const rs=$('#ruleStrong'),rw=$('#ruleWeak');
    if(rs)rs.value=85;if(rw)rw.value=60;
    /* 全清每个学科行 */
    $$('#rulePerSubj .rule-row').forEach(row=>{
      const sInp=row.querySelector('input.rule-per-s');
      const wInp=row.querySelector('input.rule-per-w');
      if(sInp)sInp.value=85;
      if(wInp)wInp.value=60;
      row.style.borderColor='var(--border)';
      row.style.background='var(--card)';
    });
    const ex=DB.exams.find(x=>x.id===($('#boardOut').dataset.examId||''));
    if(ex)renderBoardOut(ex);
    toast('已恢复全部为默认 85 / 60');
    return;
  }
  /* ---- 强弱判定标准：单科重置为默认 ---- */
  if(act==='rule-subj-reset'){
    const subj=el.dataset.subj;
    if(subj){
      delete RULES.perSubject[subj];
      saveRules();
    }
    /* 把该行所有 input 同步回 default */
    const row=el.closest('.rule-row');
    if(row){
      const sInp=row.querySelector('input.rule-per-s');
      const wInp=row.querySelector('input.rule-per-w');
      if(sInp)sInp.value=RULES.default.strong;
      if(wInp)wInp.value=RULES.default.weak;
      row.style.borderColor='var(--border)';
      row.style.background='var(--card)';
    }
    const ex=DB.exams.find(x=>x.id===($('#boardOut').dataset.examId||''));
    if(ex)renderBoardOut(ex);
    toast(`「${subj}」已恢复为默认 ${RULES.default.strong}/${RULES.default.weak}`);
    return;
  }
  /* ---- 新增：科目 chip / 模板 / Excel 上传 ---- */
  if(act==='ex-subj-add'){
    const selVal=$('#exSubjSelect').value.trim();
    if(!selVal){toast('请从下拉选要添加的科目');return;}
    addExSubject(selVal);
    /* 重设下拉：未选的常用科目在前，已选的置后但仍可再点选 */
    const used=new Set(getExSubjects());
    $('#exSubjSelect').innerHTML='<option value="">+ 添加科目…</option>'
      +[...SHANDONG_COURSES.filter(s=>!used.has(s)),...SHANDONG_COURSES.filter(s=>used.has(s))]
        .map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
    $('#exSubjSelect').value='';
    const warn=$('#exSubjWarn');if(warn)warn.style.display='none';
    return;
  }
  if(act==='ex-tpl'){downloadExamTemplate();return;}
  if(act==='ex-upload'){
    const name=$('#exName').value.trim();
    const date=$('#exDate').value;
    if(!name){toast('请先填写考试名称');return;}
    const stu=DB.students.filter(s=>!s.archived);
    if(!stu.length){
      toast('还没有学生，请先录入学生');
      showView('students');             // 跳到学生档案页
      setTimeout(()=>openStModal(),300); // 自动弹出"新增学生"
      return;
    }
    /* 同名同日检查（按班级分别判断） */
    const dStr=date||new Date().toISOString().slice(0,10);
    if(DB.exams.some(e=>e.name===name&&e.date===dStr&&e.cls===curCls)){toast(`${clsLabel(curCls)} 已有「${name}」同日期的考试`);return;}
    /* 直接弹文件选择，由 importExamFromExcel 自动创建考试并识别科目 */

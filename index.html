function schSample(){
  const tmpl={
    '周一':['语文','数学','英语','道德与法治','历史','地理','体育与健康','音乐'],
    '周二':['数学','英语','语文','生物','物理','信息科技','美术','体育与健康'],
    '周三':['语文','数学','英语','地理','历史','道德与法治','劳动','阅读'],
    '周四':['英语','语文','数学','物理','生物','体育与健康','音乐','综合实践活动'],
    '周五':['数学','语文','英语','道德与法治','地理','信息科技','美术','班团队活动']
  };
  /* 晨读（早读）按语数英轮换 */
  const tmplReading={'周一':'晨读·语文','周二':'晨读·英语','周三':'晨读·语文','周四':'晨读·英语','周五':'晨读·语文'};
  const days=DB.schedule.days, periods=DB.schedule.periods;
  DB.schedule.grid={};let k=0;
  periods.forEach((p,pi)=>{
    if(isSpecialPeriod(p)){days.forEach((d,di)=>DB.schedule.grid[pi+'-'+di]=p+'|');return;}
    if(p==='晨读'){days.forEach((d,di)=>{const sub=tmplReading[d]||'';if(sub)DB.schedule.grid[pi+'-'+di]=sub+'|';});return;}
    days.forEach((d,di)=>{const sub=(tmpl[d]&&tmpl[d][k])||'';if(sub)DB.schedule.grid[pi+'-'+di]=sub+'|';});
    k++;
  });
  save();renderSchedule();renderHomeSched();toast('已填充示例课表');
}

/* 从 Excel 解析后灌入已创建的考试 ex.students[i].subjects */
async function importExamFromExcel(ex,file){
  if(!file){return;}
  try{
    if(typeof XLSX==='undefined')await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(!rows.length){toast('Excel 是空的');return;}
    /* 智能识别表头：扫描前 6 行，找到第一个含"姓名"或 ≥2 个已知科目的行视为表头
       兼容形如：
         第1行 大标题（"莱芜区2023年小学...考生成绩表"）
         第2行 副标题（"单位：XX学校..."）
         第3行 真正的列表头（"学校/班级/考号/姓名/总分/语文/数学/英语/科学/道法"）
    */
    const trimCell=c=>String(c||'').trim();
    let header=null,headerRow=0;
    const SCAN_HEAD=6;
    for(let r=0;r<Math.min(SCAN_HEAD,rows.length);r++){
      const cells=rows[r].map(trimCell);
      const hasNameCell=cells.some(c=>c==='姓名'||c==='学生姓名'||c==='名字'||c.toLowerCase()==='name');
      const knownHits=cells.filter(c=>SHANDONG_COURSES.includes(c)).length;
      if(hasNameCell || knownHits>=2){header=cells;headerRow=r;break;}
    }
    const start=header?headerRow+1:0;
    /* 无表头：构造一个通用表头，让"数值密集列"识别仍能跑 */
    const effectiveHeader=header||(rows[0]||[]).map(trimCell).map((_,i)=>'col'+i);
    const iName=header?(header.findIndex(h=>h==='姓名'||h==='学生姓名'||h==='名字'||h.toLowerCase()==='name')):0;

    /* 自动识别所有可用作学科的列：
       1) 表头精确匹配已知科目 → 直接识别
       2) 表头不在已知科目中，但 60% 行内能解析成 0~150 的数字 → 视作数值学科，自动命名"科目N"
       排除姓名列和明显的序号/学号列（学号长度>5 且非纯数字分数） */
    const dataRows=rows.slice(start).filter(r=>String(r[iName]||'').trim().length>0);
    const totalRows=dataRows.length||1;
    const allKnown=[...SHANDONG_COURSES];
    const autoDetect=[]; // {name, idx, isKnown}
    for(let i=0;i<effectiveHeader.length;i++){
      if(i===iName)continue;
      const raw=effectiveHeader[i]||'';
      /* 先查近义词表，没有则用原名 */
      const norm=COURSE_ALIAS[raw]||raw;
      if(SHANDONG_COURSES.includes(norm)){autoDetect.push({name:norm,idx:i,isKnown:true});continue;}
      /* 无表头时，多跳过一列"序号列"（值是 1..N 的递增整数） */
      if(!header && i===iName+1){
        let seq=true;
        for(let r=0;r<dataRows.length;r++){
          const v=parseFloat(dataRows[r][i]);
          if(!(v===r+1 || v===r)){seq=false;break;}
        }
        if(seq){continue;}
      }
      /* 数值密集列：至少 60% 数据行可解析为 0~150 数字 */
      let ok=0;
      for(let r=0;r<dataRows.length;r++){
        const v=dataRows[r][i];if(v==null||v==='')continue;
        const n=parseFloat(v);if(!isNaN(n)&&n>=0&&n<=150)ok++;
      }
      const ratio=ok/totalRows;
      if(ratio>=0.6){
        autoDetect.push({name:'科目'+(autoDetect.filter(x=>!x.isKnown).length+1),idx:i,isKnown:false});
      }
    }
    if(!autoDetect.length){toast('未识别到科目列，请检查 Excel 表头或数值');return;}

    /* 如果 ex 为空（来自顶部「Excel 一键导入」，尚未创建考试）：
       从隐藏 file input 的 dataset 读取考试名/日期，自动创建考试并识别科目 */
    if(!ex){
      const fileSel=$('#exExcelFile');
      const name=(fileSel&&fileSel.dataset.exName)||'未命名考试';
      const dStr=(fileSel&&fileSel.dataset.exDate)||new Date().toISOString().slice(0,10);
      const cls=curCls==='all'?defaultClsId():curCls;
      const stu=DB.students.filter(s=>!s.archived && stuCls(s)===cls);
      ex={id:uid(),paper:false,name,date:dStr,cls,subjects:[],students:stu.map(s=>({id:s.id,name:s.name,subjects:{},total:0}))};
      DB.exams.push(ex);save();renderExList();
    }

    /* 把识别到的所有科目都纳入本次考试（含原来已选的） */
    const newSubs=[...new Set(ex.subjects.concat(autoDetect.map(x=>x.name)))];
    ex.subjects=newSubs;
    setExSubjects(newSubs);

    /* 按识别出的映射填数据 */
    let matched=0,missing=[];
    ex.students.forEach(st=>{
      const row=dataRows.find(r=>String(r[iName]||'').trim()===st.name);
      if(!row){missing.push(st.name);return;}
      let stTotal=0;
      autoDetect.forEach(col=>{
        const v=parseFloat(row[col.idx]);
        if(!isNaN(v)&&v>=0&&v<=150){st.subjects[col.name]=v;stTotal+=v;}
      });
      st.total=stTotal;
      if(stTotal>0)matched++;
    });
    save();renderExEditor(ex);
    const extraNames=autoDetect.filter(x=>!x.isKnown).map(x=>x.name);
    let tip=`已自动识别 ${autoDetect.length} 个科目，导入 ${matched} 条数据`;
    if(extraNames.length)tip+=`（含自动命名：${extraNames.join('、')}）`;
    if(missing.length)tip+=`；${missing.length} 人 Excel 中未找到`;
    toast(tip);
  }catch(err){toast('Excel 解析失败：'+(err.message||err));}
}
function renderExEditor(ex){
  const box=$('#exEditor');if(!box)return;
  box.innerHTML=`<div class="muted" style="margin-bottom:8px">录入「${esc(ex.name)}」成绩（满分100）：</div>
    <div class="row" style="margin-bottom:8px">
      <button class="btn ghost" data-action="ex-ed-upload" data-eid="${ex.id}" title="上传 Excel 自动填表">📥 从 Excel 导入</button>
      <button class="btn ghost" data-action="ex-ed-tpl" data-eid="${ex.id}" title="下载当前科目的模板">📋 下载模板</button>
      <input type="file" id="exEdFile_${ex.id}" accept=".xlsx,.xls,.csv" style="display:none">
      <span class="muted" style="font-size:12px">提示：自动识别表头科目 + 数值密集列，姓名匹配 DB.students</span>
    </div>
    <div class="scroll-x"><table class="tb"><thead><tr><th>学生</th>${ex.subjects.map(s=>`<th>${esc(s)}</th>`).join('')}<th>总分</th></tr></thead>
    <tbody>${ex.students.map(st=>`<tr data-sid="${st.id}"><td>${esc(st.name)}</td>${ex.subjects.map(s=>`<td><input type="number" min="0" max="100" data-sid="${st.id}" data-sub="${esc(s)}" value="${st.subjects[s]||''}" style="width:64px"></td>`).join('')}<td class="tot">${st.total}</td></tr>`).join('')}</tbody></table></div>
    <div class="row end" style="margin-top:10px"><button class="btn primary" id="exSaveScores">保存并计算</button></div>`;
  $('#exSaveScores').onclick=()=>{
    $$('#exEditor input[type=number]').forEach(inp=>{const sid=inp.dataset.sid,sub=inp.dataset.sub;const st=ex.students.find(x=>x.id===sid);st.subjects[sub]=+inp.value||0;});
    ex.students.forEach(st=>{st.total=ex.subjects.reduce((a,s)=>a+(st.subjects[s]||0),0);});
    save();renderExList();renderBoardOut(ex);toast('成绩已保存');
  };
  /* 编辑器内的 Excel 上传 */
  const edBtn=document.querySelector(`[data-action="ex-ed-upload"][data-eid="${ex.id}"]`);
  if(edBtn){
    edBtn.onclick=()=>{$(`#exEdFile_${ex.id}`).click();};
    $(`#exEdFile_${ex.id}`).onchange=(e)=>{importExamFromExcel(ex,e.target.files[0]);e.target.value='';};
  }
  const tplBtn=document.querySelector(`[data-action="ex-ed-tpl"][data-eid="${ex.id}"]`);
  if(tplBtn){
    tplBtn.onclick=()=>{
      const ws=XLSX.utils.aoa_to_sheet([['姓名',...ex.subjects],...ex.students.map(s=>[s.name,...ex.subjects.map(_=>'')])]);
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,'成绩');
      XLSX.writeFile(wb,`${ex.name}-导入模板.xlsx`);
      toast('模板已下载');
    };
  }
}

/* ============================================================
   侧边栏拖动（位置本地记忆）
   ============================================================ */
const SB_POS_KEY='xifan_sidebar_pos';
function initSidebarDrag(){
  const sb=$('#sidebar');const grip=sb.querySelector('.side-grip');if(!grip)return;
  let drag=null;
  const saved=localStorage.getItem(SB_POS_KEY);
  if(saved){try{const p=JSON.parse(saved);sb.style.left=p.x+'px';sb.style.top=p.y+'px';}catch(e){}}
  grip.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const r=sb.getBoundingClientRect();
    drag={dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width};
    sb.classList.add('dragging');
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener('pointermove',e=>{
    if(!drag)return;
    const h=sb.offsetHeight;
    let x=Math.max(0,Math.min(e.clientX-drag.dx, window.innerWidth-drag.w));
    let y=Math.max(56,Math.min(e.clientY-drag.dy, window.innerHeight-h));
    sb.style.left=x+'px';sb.style.top=y+'px';
    localStorage.setItem(SB_POS_KEY,JSON.stringify({x,y}));
    updateContentMargin();
  });
  const end=e=>{if(!drag)return;drag=null;sb.classList.remove('dragging');updateContentMargin();try{grip.releasePointerCapture(e.pointerId);}catch(_){}};
  grip.addEventListener('pointerup',end);
  grip.addEventListener('pointercancel',end);
  /* 双击手柄复位到左侧默认位置 */
  grip.addEventListener('dblclick',()=>{
    sb.style.left='0px';sb.style.top='56px';localStorage.setItem(SB_POS_KEY,JSON.stringify({x:0,y:56}));updateContentMargin();
  });
}

/* 导航图标拖动排序 */
function initNavDrag(){
  const sb=$('#sidebar');let dragView=null;
  sb.addEventListener('dragstart',e=>{
    const it=e.target.closest('.nav-item');if(!it){e.preventDefault();return;}
    dragView=it.dataset.view;it.classList.add('drag-src');
    e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain',dragView);}catch(_){}
  });
  sb.addEventListener('dragover',e=>{
    e.preventDefault();
    const it=e.target.closest('.nav-item');if(!it||!dragView||it.dataset.view===dragView)return;
    e.dataTransfer.dropEffect='move';
    $$('.nav-item').forEach(n=>n.classList.remove('drag-over'));
    it.classList.add('drag-over');
  });
  sb.addEventListener('dragleave',e=>{const it=e.target.closest('.nav-item');if(it)it.classList.remove('drag-over');});
  sb.addEventListener('drop',e=>{
    e.preventDefault();
    const it=e.target.closest('.nav-item');
    $$('.nav-item').forEach(n=>n.classList.remove('drag-over','drag-src'));
    if(!it||!dragView||it.dataset.view===dragView){dragView=null;return;}
    const after=(e.clientY>it.getBoundingClientRect().top+it.offsetHeight/2);
    const dv=dragView;dragView=null;reorderNav(dv,it.dataset.view,after);
  });
  sb.addEventListener('dragend',()=>{dragView=null;$$('.nav-item').forEach(n=>n.classList.remove('drag-over','drag-src'));});
}
